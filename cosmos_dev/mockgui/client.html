<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SBS Remote GUI</title>
<style>
  @font-face { font-family:'GoldmanSansCd_Rg'; src:url('/fonts/GoldmanSansCd_Rg.ttf') format('truetype'); }
  @font-face { font-family:'Goldman-Bold';     src:url('/fonts/Goldman-Bold.ttf')     format('truetype'); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0f14; --surface: #161923; --border: #2a2f3d;
    --accent:  #4f8ef7; --text:    #e2e8f0; --text-dim: #64748b;
    --danger:  #ef4444; --success: #22c55e; --radius: 6px;
    --font-ui: 'JetBrains Mono', 'Fira Code', monospace;
  }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #topbar { display:flex; align-items:center; gap:12px; padding:8px 16px;
            background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
  #topbar .logo { font-size:13px; font-weight:700; letter-spacing:0.15em; color:var(--accent); text-transform:uppercase; }
  #status-dot   { width:8px; height:8px; border-radius:50%; background:var(--danger); transition:background 0.3s; }
  #status-dot.connected { background:var(--success); }
  #status-text  { font-size:11px; color:var(--text-dim); }
  #cid-badge    { margin-left:auto; font-size:11px; color:var(--text-dim); }
  #msg-counter  { font-size:11px; color:var(--accent); }

  #gui-root { flex:1; position:relative; overflow:hidden; }
  .gui-buffer { position:absolute; inset:0; }
  .gui-buffer.back  { display:none; }
  .gui-buffer.front { display:block; }

  .widget { position:absolute; display:flex; align-items:center; justify-content:center;
            font-family:var(--font-ui); font-size:12px; overflow:hidden; pointer-events:auto; }

  .w-button { background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
              cursor:pointer; font-family:var(--font-ui); font-size:12px; font-weight:600;
              letter-spacing:0.04em; transition:filter 0.15s,transform 0.1s; width:100%; height:100%; }
  .w-button:hover { filter:brightness(1.15); } .w-button:active { transform:scale(0.97); }

  .w-checkbox { gap:6px; justify-content:flex-start; padding-left:6px; cursor:pointer; user-select:none; }
  .w-checkbox input[type=checkbox] { width:14px; height:14px; accent-color:var(--accent); }
  .w-checkbox span { font-size:12px; }

  .w-clickregion { cursor:pointer; background:transparent; border:1px dashed var(--border);
                   border-radius:var(--radius); transition:background 0.15s; }
  .w-clickregion:hover { background:var(--cr-hover-bg, rgba(79,142,247,0.06)); }
  .cr-hover-text { opacity:0; transition:opacity 0.15s; pointer-events:none; }
  .w-clickregion:hover .cr-hover-text { opacity:1; }

  .w-colorbutton { border-radius:var(--radius); cursor:pointer; border:2px solid var(--border); transition:border-color 0.15s; }
  .w-colorbutton:hover { border-color:var(--accent); }

  .w-colorcheckbox { gap:6px; justify-content:flex-start; padding-left:6px; cursor:pointer; }
  .w-colorcheckbox .swatch { width:14px; height:14px; border-radius:3px; border:1px solid var(--border); flex-shrink:0; }

  .w-dropdown select { width:100%; height:100%; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius); padding:0 8px;
    font-family:var(--font-ui); font-size:12px; cursor:pointer; appearance:none; }

  .w-face       { overflow:hidden; }
  .w-face canvas { display:block; width:100%; height:100%; }
  .w-icon       { background:transparent; overflow:hidden; }
  .w-iconbutton { background:transparent; overflow:hidden; cursor:pointer;
                  border-radius:var(--radius); transition:filter 0.15s; }
  .w-iconbutton:hover { filter:brightness(1.3); }
  .w-iconcheckbox { overflow:hidden; cursor:pointer; border:2px solid transparent;
                    border-radius:var(--radius); transition:border-color 0.15s,background 0.15s; }
  .w-iconcheckbox.checked { border-color:var(--accent); background:rgba(79,142,247,0.12); }

  .w-image { overflow:hidden; pointer-events:none; }
  .w-image canvas { display:block; width:100%; height:100%; }

  .w-rawiconbutton { background:transparent; overflow:hidden; cursor:pointer;
                     border-radius:var(--radius); transition:filter 0.15s; }
  .w-rawiconbutton:hover { filter:brightness(1.3); }

  .w-slider { padding:0; display:flex; align-items:stretch; }
  .w-slider:not(.vertical) { flex-direction:row; gap:6px; padding:0 4px; }
  .w-slider.vertical { flex-direction:column; }
  .slider-track { position:relative; flex:1; background:rgba(255,255,255,0.1); border-radius:3px; cursor:pointer; min-width:0; min-height:0; transition:background 0.1s; }
  .slider-track:hover { background:rgba(255,255,255,0.16); }
  .slider-thumb { position:absolute; background:var(--accent,#4f8ef7); border-radius:3px; cursor:grab; transition:background 0.1s; }
  .slider-thumb:hover { background:#6fa8ff; }
  .slider-thumb:active { cursor:grabbing; background:#90bfff; }
  .w-slider:not(.vertical) .slider-thumb { top:2px; bottom:2px; width:14px; transform:translateX(-50%); }
  .w-slider.vertical .slider-thumb { left:2px; right:2px; height:14px; transform:translateY(-50%); }
  .slider-num { font-size:11px; min-width:2.5em; text-align:right; color:var(--text-dim); flex-shrink:0; white-space:nowrap; align-self:center; }

  .region-container { position:absolute; overflow:hidden; pointer-events:none; }
  /* UNCLIP debug (gui-sizing-accuracy): reveal overflow the real engine would
     draw but the browser normally clips. Outlines regions (red) + widgets (blue). */
  body.unclip #gui-root, body.unclip .gui-buffer,
  body.unclip .region-container, body.unclip .region-buffer { overflow:visible !important; }
  body.unclip .region-container { outline:1px solid rgba(255,70,70,0.55); }
  body.unclip .widget { outline:1px solid rgba(90,170,255,0.45); }
  .region-buffer    { position:absolute; inset:0; pointer-events:none; }
  .region-buffer.front { display:block; }
  .region-buffer.back  { display:none; }

  /* line-height/padding tuned to the sbs_utils layout budget: rows are reserved at
     get_text_line_height (≈1.25× the font px), so the old CSS line-height:1.5 + 6px
     padding overran the box and CLIPPED text the engine draws fine (browser-only
     artifact — engine blits tight to the rect). See gui-sizing-accuracy notes. */
  .w-text { background:transparent; padding:0 2px; justify-content:flex-start;
            align-items:flex-start; white-space:pre-wrap; word-break:break-word; line-height:1.2;
            pointer-events:none; }

  .w-typein input { width:100%; height:100%; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius); padding:0 8px;
    font-family:var(--font-ui); font-size:12px; outline:none; transition:border-color 0.15s; }
  .w-typein input:focus { border-color:var(--accent); }

  .w-3dship { overflow:hidden; background:#000; }

  .log-btn  { font-size:11px; padding:2px 8px; background:var(--surface); color:var(--text-dim);
              border:1px solid var(--border); border-radius:3px; cursor:pointer;
              font-family:var(--font-ui); letter-spacing:0.05em; }
  .log-btn.active { color:var(--accent); border-color:var(--accent); }
  .log-panel { display:none; height:160px; flex-shrink:0;
               border-top:1px solid var(--border); overflow-y:auto; padding:6px 14px; }
  .log-panel.visible { display:block; }
  #script-log-panel { background:#090b0f; }
  #dbg-log-panel    { background:#0a0c10; }
  .log-line     { font-size:10px; color:var(--text-dim); line-height:1.7; white-space:pre; }
  .log-line.out { color:#e2e8f0; }
  .log-line.err { color:#fca5a5; }
  .log-line.ev  { color:#86efac; }
  .log-line.cmd { color:#93c5fd; }
  .log-line.dbg { color:#fcd34d; }

  /* 2D view overlay — full viewport transparent canvas; drawn regions appear on top of mission GUI */
  #radar-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh;
                  z-index:9998; pointer-events:none; }
  /* Cinematic 3D main-screen view — full viewport, behind the mission GUI but
     above the opaque body background (z-index:-1 paints just over the root bg). */
  #view3d-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh;
                   z-index:-1; display:none; pointer-events:none; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">SBS GUI</span>
  <div id="status-dot"></div>
  <span id="status-text">disconnected</span>
  <span id="msg-counter">msgs: <span id="msg-count">0</span></span>
  <span id="cid-badge"><span id="mode-label">—</span> #<span id="cid-val">—</span></span>
  <span id="run-badge" style="display:none;font-weight:700;" title="Mission run index — 1 is the first run, every restart bumps it">run 1</span>
  <button id="script-log-btn" class="log-btn" title="Toggle MAST/sbs_utils stdout+stderr">LOG</button>
  <button id="dbg-log-btn"    class="log-btn" title="Toggle browser WS/widget debug">DBG</button>
  <button id="corner-radar-btn" class="log-btn" title="Toggle the fallback corner radar (when no console 2D view is active)">RADAR</button>
  <button id="unclip-btn" class="log-btn" title="Disable region clipping + outline boxes to reveal widget overflow the engine would show">UNCLIP</button>
</div>

<div id="gui-root">
  <div id="buf-front" class="gui-buffer front"></div>
  <div id="buf-back"  class="gui-buffer back"></div>
</div>

<canvas id="view3d-canvas" width="320" height="240"></canvas>
<canvas id="radar-canvas" width="180" height="180"></canvas>

<div id="script-log-panel" class="log-panel"></div>
<div id="dbg-log-panel"    class="log-panel"></div>

<script src="/three.min.js"></script>
<script src="/face.js"></script>
<script>
// ── Config ───────────────────────────────────────────────────────────────────
// /server → connects as the server console (clientID=0, no client_connect fired)
// /web/<path> → connects as a MAST web page (//web/<path>), unique clientID, no console flow
// /client or anything else → connects as a new client (unique clientID)
// A web page renders like a client (its own frame, by CLIENT_ID), so _mode
// stays 'client'; only the WebSocket route carries the /web/<path> sub-path.
const _isWeb = location.pathname.startsWith('/web/');
const _mode  = location.pathname === '/server' ? 'server' : 'client';
const _wsRoute = location.pathname === '/server' ? 'server'
               : _isWeb ? 'web/' + location.pathname.slice('/web/'.length)
               : 'client';
// Web pages carry their query string through to the server so /web/x?a=1 can
// seed page variables.
const WS_URL = `ws://${location.host}/ws/${_wsRoute}` + (_isWeb ? location.search : '');
let CLIENT_ID = null;   // assigned by server on connect via "init" message
let IS_STATIC = false;  // static snapshot mode: render embedded frames, no WebSocket

let msgCount = 0;

// ── Three.js shared infrastructure ───────────────────────────────────────────
// One WebGL context for all image widgets — browsers cap contexts at ~16 per page.
// The shared renderer renders each widget's scene to an offscreen canvas, then
// the result is blitted into the widget's visible 2D canvas.
const _threeRenderer = (() => {
  if (typeof THREE === 'undefined') return null;
  try {
    const offscreen = document.createElement('canvas');
    const r = new THREE.WebGLRenderer({ canvas: offscreen, alpha: true });
    return r;
  } catch(e) {
    console.error('[three.js] WebGLRenderer init failed:', e);
    return null;
  }
})();
const _tl       = _threeRenderer ? new THREE.TextureLoader() : null;
const _texCache = new Map();   // src → { tex, cbs[] }
const _colorCtx = (() => { const c = document.createElement('canvas'); c.width = c.height = 1; return c.getContext('2d'); })();

// ── Icon sheet infrastructure ─────────────────────────────────────────────
// grid-icon-sheet.png: 2560×2560, 20 columns, 128×128 per icon (RGBA, white-on-transparent).
// multiply-blend tinting works perfectly on white-on-transparent sprites.
const ICON_COLS     = 20;
const ICON_SRC_SIZE = 128;
const _iconSheet    = { img: null, cbs: null };  // cbs=null: not yet started

function _getIconSheet(cb) {
  if (_iconSheet.img)          { cb(_iconSheet.img); return; }
  if (_iconSheet.cbs !== null) { _iconSheet.cbs.push(cb); return; }
  _iconSheet.cbs = [cb];
  const img = new Image();
  img.onload  = () => { _iconSheet.img = img; const cbs = _iconSheet.cbs; _iconSheet.cbs = null; cbs.forEach(f => f(img)); };
  img.onerror = () => { console.error('[icon] failed to load grid-icon-sheet.png'); const cbs = _iconSheet.cbs; _iconSheet.cbs = null; cbs.forEach(f => f(null)); };
  img.src = 'grid-icon-sheet.png';
}

function _drawIcon(canvas, ctx2d, sheet, iconIndex, colorStr) {
  const w = canvas.width, h = canvas.height;
  if (!sheet || w <= 0 || h <= 0) return;
  const col = iconIndex % ICON_COLS,    row = Math.floor(iconIndex / ICON_COLS);
  const sx  = col * ICON_SRC_SIZE,      sy  = row * ICON_SRC_SIZE;
  const {r, g, b, a} = _parseColor(colorStr || 'white');
  const isWhite = r >= 0.99 && g >= 0.99 && b >= 0.99;
  ctx2d.clearRect(0, 0, w, h);
  if (isWhite) {
    ctx2d.save(); ctx2d.globalAlpha = a;
    ctx2d.drawImage(sheet, sx, sy, ICON_SRC_SIZE, ICON_SRC_SIZE, 0, 0, w, h);
    ctx2d.restore();
  } else {
    // Tint on an OffscreenCanvas (multiply preserves colour, destination-in preserves alpha),
    // then blit to visible canvas with the requested opacity.
    const tmp  = new OffscreenCanvas(w, h);
    const tctx = tmp.getContext('2d');
    tctx.drawImage(sheet, sx, sy, ICON_SRC_SIZE, ICON_SRC_SIZE, 0, 0, w, h);
    tctx.globalCompositeOperation = 'multiply';
    tctx.fillStyle = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
    tctx.fillRect(0, 0, w, h);
    tctx.globalCompositeOperation = 'destination-in';
    tctx.drawImage(sheet, sx, sy, ICON_SRC_SIZE, ICON_SRC_SIZE, 0, 0, w, h);
    ctx2d.save(); ctx2d.globalAlpha = a;
    ctx2d.drawImage(tmp, 0, 0);
    ctx2d.restore();
  }
}

// Draw an atlas glyph (icon_index) at a radar position, tinted, `size` px square. Used for
// galaxy-board markers (behav_selection), which the engine renders as flat atlas icons — not
// ship meshes. Renders into a reused scratch canvas then blits, so it composites onto the
// shared radar 2D context at the marker's screen position.
const _radarIconScratch = document.createElement('canvas');
function _drawRadarIcon(ctx, sheet, iconIndex, px, py, size, colorStr) {
  if (!sheet || size < 2) return;
  _radarIconScratch.width = _radarIconScratch.height = 48;
  _drawIcon(_radarIconScratch, _radarIconScratch.getContext('2d'), sheet, iconIndex, colorStr);
  ctx.drawImage(_radarIconScratch, px - size / 2, py - size / 2, size, size);
}

function _buildIconWidget(s, tag, ownerId, cssClass, isClickable, isToggle) {
  const wrapper = document.createElement('div');
  wrapper.className = cssClass;

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'display:block;width:100%;height:100%;';
  wrapper.appendChild(canvas);
  const ctx2d = canvas.getContext('2d');

  const iconIndex = s.icon_index !== undefined ? +s.icon_index : 0;
  const colorStr  = (s.color || 'white').trim();

  function render(w, h) {
    if (w <= 0 || h <= 0) return;
    canvas.width = w; canvas.height = h;
    _getIconSheet(sheet => { if (sheet) _drawIcon(canvas, ctx2d, sheet, iconIndex, colorStr); });
  }
  new ResizeObserver(entries => {
    const r = entries[0].contentRect;
    render(Math.round(r.width), Math.round(r.height));
  }).observe(wrapper);
  _getIconSheet(() => {});   // preload sheet early

  if (isToggle) {
    let checked = false;
    wrapper.style.cursor = 'pointer';
    wrapper.addEventListener('click', () => {
      checked = !checked;
      wrapper.classList.toggle('checked', checked);
      sendEvent('change', tag, ownerId, { checked });
    });
  } else {
    const clickTag = s.click_tag ? s.click_tag.trim() : tag;
    if (isClickable || s.click_tag) {
      wrapper.style.cursor = 'pointer';
      wrapper.addEventListener('click', () => sendEvent('gui_message', clickTag, ownerId));
    }
  }

  return wrapper;
}

// ── Face sheet infrastructure ─────────────────────────────────────────────
// The compositor now lives in the shared /face.js (window.FaceRender) so the
// VS Code AMD extension can reuse the exact same renderer. Sprite sheets live
// in data/graphics/, served at the root URL by server.py — FaceRender's default
// resolver (basename + ".png") loads them from there. Thin aliases below keep
// the existing call sites unchanged.
const _parseFaceString = (str) => FaceRender.parse(str);
const _drawFace = (canvas, ctx2d, layers) => FaceRender.draw(canvas, ctx2d, layers);

// Parse any CSS color string (named, hex, rgb, rgba, with leading whitespace)
// using the browser's own color parser. Returns { r, g, b, a } in [0,1].
function _parseColor(cssColor) {
  _colorCtx.clearRect(0, 0, 1, 1);
  _colorCtx.fillStyle = '#ffffff';  // reset to known value
  _colorCtx.fillStyle = cssColor;
  const normalized = _colorCtx.fillStyle;  // browser normalises to #rrggbb or rgba(...)
  const hex  = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(normalized);
  const rgba = /rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([\d.]+)\s*\)/.exec(normalized);
  if (hex)  return { r: parseInt(hex[1],16)/255,  g: parseInt(hex[2],16)/255,  b: parseInt(hex[3],16)/255,  a: 1 };
  if (rgba) return { r: parseInt(rgba[1])/255,     g: parseInt(rgba[2])/255,    b: parseInt(rgba[3])/255,    a: parseFloat(rgba[4]) };
  return { r: 1, g: 1, b: 1, a: 1 };  // unrecognised → white (no tint)
}

function _loadTex(src, onLoad) {
  if (!_tl || !_threeRenderer) { onLoad(null); return; }
  if (_texCache.has(src)) {
    const e = _texCache.get(src);
    if (e.tex) onLoad(e.tex);
    else       e.cbs.push(onLoad);
    return;
  }
  const e = { tex: null, cbs: [onLoad] };
  _texCache.set(src, e);
  _tl.load(src,
    tex  => { e.tex = tex; e.cbs.forEach(cb => cb(tex)); e.cbs = []; },
    undefined,
    ()   => {
      console.error('[image] failed to load:', src);
      _texCache.delete(src);   // allow retry on next request
      e.cbs.forEach(cb => cb(null)); e.cbs = [];
    }
  );
}

function _buildImageWidget(s) {
  const wrapper = document.createElement('div');
  wrapper.className = 'w-image';
  if (!s.image || !_threeRenderer) return wrapper;

  // Visible 2D canvas — the shared WebGL renderer blits into it each render.
  const displayCanvas = document.createElement('canvas');
  const ctx2d = displayCanvas.getContext('2d');
  wrapper.appendChild(displayCanvas);

  const scene  = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const mat    = new THREE.MeshBasicMaterial({ transparent: true, color: 0xffffff });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

  let lastW = 0, lastH = 0;

  function doRender(w, h) {
    if (w <= 0 || h <= 0) return;
    lastW = w; lastH = h;
    if (!mat.map) return;
    displayCanvas.width  = w;
    displayCanvas.height = h;
    _threeRenderer.setSize(w, h, false);   // false = don't touch CSS size
    _threeRenderer.render(scene, camera);
    ctx2d.clearRect(0, 0, w, h);
    ctx2d.drawImage(_threeRenderer.domElement, 0, 0);
  }

  _loadTex(s.image + '.png', tex => {
    if (!tex) return;
    const hasSub = s.sub_rect || s.sub_left !== undefined;
    if (hasSub) {
      const parts = s.sub_rect ? s.sub_rect.split(',').map(Number) : [0, 0, 1, 1];
      let sl = s.sub_left   !== undefined ? +s.sub_left   : parts[0];
      let st = s.sub_top    !== undefined ? +s.sub_top    : parts[1];
      let sr = s.sub_right  !== undefined ? +s.sub_right  : parts[2];
      let sb = s.sub_bottom !== undefined ? +s.sub_bottom : parts[3];
      // sub_rect is in PIXELS of the source image - confirmed against the engine with
      // missions/media_probe, which draws the same card as pixels and as 0..1 and only
      // the pixel one is right. This used to read them as texture coordinates, so every
      // sheet cell (the casino's 190x280 cards) tiled instead of cropping.
      const iw = (tex.image && tex.image.width) || 0;
      const ih = (tex.image && tex.image.height) || 0;
      if (iw && ih && (sr > 1 || sb > 1)) {
        sl /= iw; sr /= iw; st /= ih; sb /= ih;
      }
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.repeat.set(sr - sl || 1, sb - st || 1);
      tex.offset.set(sl, 1 - sb);   // three.js v is bottom-up; sub_rect is top-down
      tex.needsUpdate = true;
    }
    mat.map = tex;
    if (s.color) {
      const { r, g, b, a } = _parseColor(s.color);
      mat.color.setRGB(r, g, b);
      mat.opacity = a;
    }
    mat.needsUpdate = true;
    doRender(lastW || wrapper.clientWidth, lastH || wrapper.clientHeight);
  });

  new ResizeObserver(entries => {
    const { width, height } = entries[0].contentRect;
    doRender(width, height);
  }).observe(wrapper);

  return wrapper;
}

// ── 3D ship rendering ────────────────────────────────────────────────────────
// Minimal OBJ parser — handles v/vt/vn/f, triangulates polygons, flips UV.V.
function _parseOBJ(text) {
  const pos = [], tc = [], nrm = [];
  const posOut = [], uvOut = [], nrmOut = [];
  const idxOut = [];
  const vmap = new Map();
  let vi = 0;
  let hasNormals = false;

  const addVert = key => {
    if (vmap.has(key)) return vmap.get(key);
    const parts = key.split('/');
    const pi = +parts[0] - 1;
    const ti = parts.length > 1 && parts[1] ? +parts[1] - 1 : -1;
    const ni = parts.length > 2 && parts[2] ? +parts[2] - 1 : -1;
    const p = pos[pi] || [0, 0, 0];
    posOut.push(p[0], p[1], p[2]);
    const t = ti >= 0 && tc[ti] ? tc[ti] : [0, 0];
    uvOut.push(t[0], t[1]);
    if (ni >= 0 && nrm[ni]) {
      nrmOut.push(nrm[ni][0], nrm[ni][1], nrm[ni][2]);
      hasNormals = true;
    } else {
      nrmOut.push(0, 1, 0);
    }
    vmap.set(key, vi);
    return vi++;
  };

  for (const rawLine of text.split('\n')) {
    const p = rawLine.trim().split(/\s+/);
    switch (p[0]) {
      case 'v':  pos.push([+p[1], +p[2], +p[3]]); break;
      case 'vt': tc.push([+p[1], 1 - +p[2]]); break;  // flip V for Three.js
      case 'vn': nrm.push([+p[1], +p[2], +p[3]]); break;
      case 'f': {
        const verts = p.slice(1).map(addVert);
        for (let i = 1; i < verts.length - 1; i++)
          idxOut.push(verts[0], verts[i], verts[i + 1]);
        break;
      }
    }
  }
  return { posOut, uvOut, nrmOut, idxOut, hasNormals };
}

// ── Ship mesh loader (shared, cached) ─────────────────────────────────────────
// Loads /ships/<art>.obj once per art root, builds a centered geometry + Phong
// material with diffuse/specular/emissive maps, and resolves a base THREE.Mesh.
// Callers clone() it (clone shares geometry+material — cheap per instance).
// base.userData.maxDim is the model's largest dimension, for scaling/framing.
const _shipMeshCache = new Map();   // art → Promise<THREE.Mesh|null>
function loadShipMesh(art) {
  if (!art || typeof THREE === 'undefined') return Promise.resolve(null);
  let p = _shipMeshCache.get(art);
  if (p) return p;
  const root = 'ships/' + art;
  p = fetch('/' + root + '.obj')
    .then(r => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.text(); })
    .then(text => {
      const { posOut, uvOut, nrmOut, idxOut, hasNormals } = _parseOBJ(text);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posOut), 3));
      geo.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uvOut), 2));
      geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(nrmOut), 3));
      geo.setIndex(new THREE.BufferAttribute(new Uint32Array(idxOut), 1));
      if (!hasNormals) geo.computeVertexNormals();
      // Center geometry at origin.
      geo.computeBoundingBox();
      const box = geo.boundingBox;
      geo.translate(-(box.max.x + box.min.x) / 2,
                    -(box.max.y + box.min.y) / 2,
                    -(box.max.z + box.min.z) / 2);
      geo.computeBoundingBox();
      const size = new THREE.Vector3(); geo.boundingBox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;

      const mat = new THREE.MeshPhongMaterial({ color: 0xaaaaaa, shininess: 40, specular: 0x444444 });
      _loadTex(root + '_diffuse.png',  tex => { if (tex) { mat.map = tex; mat.color.setHex(0xffffff); mat.needsUpdate = true; } });
      _loadTex(root + '_specular.png', tex => { if (tex) { mat.specularMap = tex; mat.needsUpdate = true; } });
      _loadTex(root + '_emissive.png', tex => { if (tex) { mat.emissiveMap = tex; mat.emissive.setHex(0xffffff); mat.emissiveIntensity = 1.5; mat.needsUpdate = true; } });

      const base = new THREE.Mesh(geo, mat);
      base.userData.maxDim = maxDim;
      return base;
    })
    .catch(e => { log(`[mesh] load failed: ${root} — ${e}`, 'err'); return null; });
  _shipMeshCache.set(art, p);
  return p;
}

// One entry per live 3dship widget; the global RAF loop drains this list.
const _3dshipScenes = [];

function _build3dship(msg) {
  const el = document.createElement('div');
  el.className = 'w-3dship';

  if (!_threeRenderer) {
    el.textContent = '[3dship: no WebGL]';
    return el;
  }

  const displayCanvas = document.createElement('canvas');
  displayCanvas.style.cssText = 'display:block;width:100%;height:100%;';
  el.appendChild(displayCanvas);
  const ctx2d = displayCanvas.getContext('2d');

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1e8);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(2, 3, 2);
  scene.add(sun);

  const entry = { scene, camera, mesh: null, canvas: displayCanvas, ctx: ctx2d,
                  width: 0, height: 0, rotY: 0 };
  _3dshipScenes.push(entry);

  if (msg.artfileroot) {
    loadShipMesh(msg.artfileroot).then(base => {
      if (!base) return;
      const m = base.clone();   // shares geometry + material
      scene.add(m);
      entry.mesh = m;

      // Position camera so the model fills roughly 2/3 of the viewport height.
      const maxDim = base.userData.maxDim || 1;
      const fovRad = camera.fov * Math.PI / 180;
      const dist   = (maxDim / 2) / Math.tan(fovRad / 2) * 1.6;
      camera.position.set(0, maxDim * 0.15, dist);
      camera.near = dist * 0.001;
      camera.far  = dist * 100;
      camera.lookAt(0, 0, 0);
    });
  }

  new ResizeObserver(entries => {
    const rc = entries[0].contentRect;
    entry.width  = Math.round(rc.width);
    entry.height = Math.round(rc.height);
  }).observe(el);

  return el;
}

// Global RAF loop — renders all live 3dship scenes through the shared WebGL renderer.
(function _start3dLoop() {
  if (!_threeRenderer) return;
  function loop() {
    requestAnimationFrame(loop);
    for (let i = _3dshipScenes.length - 1; i >= 0; i--) {
      const e = _3dshipScenes[i];
      // Auto-remove scenes whose canvas left the DOM (buffer swap / page rebuild)
      if (!e.canvas.isConnected) { _3dshipScenes.splice(i, 1); continue; }
      if (!e.mesh || e.width <= 0 || e.height <= 0) continue;
      e.rotY += 0.005;
      e.mesh.rotation.y = e.rotY;
      e.canvas.width  = e.width;
      e.canvas.height = e.height;
      e.camera.aspect = e.width / e.height;
      e.camera.updateProjectionMatrix();
      _threeRenderer.setSize(e.width, e.height, false);
      _threeRenderer.render(e.scene, e.camera);
      e.ctx.clearRect(0, 0, e.width, e.height);
      e.ctx.drawImage(_threeRenderer.domElement, 0, 0);
    }
  }
  loop();
})();

// ── Region registry ───────────────────────────────────────────────────────────
// Each entry: { container, front, back, inProgress, parentTag }

const _regions = {

// ── WebSocket ────────────────────────────────────────────────────────────────
let ws;
function connect() {
  log(`connecting to ${WS_URL}`, 'ev');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('status-dot').classList.add('connected');
    document.getElementById('status-text').textContent = 'connected';
    log(`WS open → ${WS_URL}`, 'ev');
  };
  ws.onclose = (e) => {
    document.getElementById('status-dot').classList.remove('connected');
    document.getElementById('status-text').textContent = 'reconnecting…';
    log(`WS closed code=${e.code} — retry 2s`, 'err');
    setTimeout(connect, 2000);
  };
  ws.onerror = (e) => log('WS error: ' + JSON.stringify(e), 'err');

  ws.onmessage = (ev) => {
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount;
    let data;
    try { data = JSON.parse(ev.data); }
    catch(e) { log('bad JSON: ' + ev.data, 'err'); return; }
    // The server coalesces a tick's commands into ONE frame (a JSON array); replay
    // still sends single objects. Accept both.
    const msgs = Array.isArray(data) ? data : [data];
    for (const msg of msgs) {
      log(`RX cmd=${msg.cmd} tag=${msg.tag??'—'} clientID=${msg.clientID}`, 'cmd');
      dispatch(msg);
    }
  };
}

// Static snapshot mode: a generator embeds window.__STATIC_FRAMES__ (a list of
// wire commands from a one-shot render). Render them once and do NOT open a
// WebSocket - a read-only page with no live session.
if (Array.isArray(window.__STATIC_FRAMES__)) {
  IS_STATIC = true;
  const st = document.getElementById('status-text');
  if (st) st.textContent = 'static';
  for (const msg of window.__STATIC_FRAMES__) dispatch(msg);
} else {
  connect();
}

// ── Event → server ────────────────────────────────────────────────────────────
// clientID is the owner of the widget that fired the event — taken from the
// command that rendered it, so server-page widgets fire as 0 and client-page
// widgets fire as the browser's assigned ID automatically.
function sendEvent(type, tag, clientID, detail = {}) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type, tag, clientID, ...detail }));
  log(`TX ${type} tag=${tag} clientID=${clientID}`, 'ev');
}

// ── Field health heartbeat ────────────────────────────────────────────────────
// Once a second, tell the runner what this browser is ACTUALLY rendering. The
// numbers that matter across a mission restart: how many dynamic objects the
// client knows about, and how many of them MOVED since the last sample. A run
// where npcs > 0 but moving == 0 is the "enemies frozen on run 2" bug, caught as
// a number instead of by eye. Also flushes any pending resync requests.
const _fieldLastPos = new Map();   // id → [x, z] at the previous sample
function _fieldHealthTick() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (_resyncWanted.size) {
    sendEvent('radar_resync', '', CLIENT_ID ?? 0, { ids: [..._resyncWanted].slice(0, 200) });
    _resyncWanted.clear();
  }
  let moving = 0, npcs = 0, players = 0;
  const seen = new Set();
  for (const [id, idx] of _dynamicMap) {
    seen.add(id);
    const m = _dynamicMeta.get(id) || {};
    const tt = String(m.tick_type || '');
    if (tt.includes('player')) players++; else npcs++;
    const x = _dynamicPosBuf ? _dynamicPosBuf[idx * 3]     : 0;
    const z = _dynamicPosBuf ? _dynamicPosBuf[idx * 3 + 1] : 0;
    const p = _fieldLastPos.get(id);
    if (p && (Math.abs(p[0] - x) > 0.5 || Math.abs(p[1] - z) > 0.5)) moving++;
    _fieldLastPos.set(id, [x, z]);
  }
  for (const id of [..._fieldLastPos.keys()]) if (!seen.has(id)) _fieldLastPos.delete(id);
  sendEvent('field_stats', '', CLIENT_ID ?? 0, {
    run: _runIndex, dyn: _dynamicCount, terrain: _terrainCount,
    npcs, players, moving, orphans: _deltaOrphans,
    view3d: !!_view3dActive, wgpu: !!window.__webgpu3dview,
  });
}
setInterval(_fieldHealthTick, 1000);

// ── Dispatch ──────────────────────────────────────────────────────────────────
function dispatch(msg) {
  // In client mode, ignore GUI commands addressed to the server (clientID "0") or any
  // other client. The server rebuilds and broadcasts its own frame every tick; without
  // this filter those clear/complete cycles wipe the client's own frame each tick.
  if (!IS_STATIC && _mode === 'client' && CLIENT_ID !== null &&
      msg.cmd !== 'init' && msg.cmd !== 'log' &&
      msg.cmd !== 'radar' && msg.cmd !== 'radar_terrain' &&
      msg.cmd !== 'widget_rect' && msg.cmd !== 'cinematic' &&
      msg.cmd !== 'skybox' && msg.cmd !== 'colors' && msg.cmd !== 'fx' && msg.cmd !== 'batch' &&
      msg.cmd !== 'ship_data' && msg.cmd !== 'target_data' &&
      msg.cmd !== 'text_msg' && msg.cmd !== 'text_active' && msg.cmd !== 'world_reset' &&
    msg.cmd !== 'run_marker') {
    if (msg.clientID !== CLIENT_ID) return;
  }
  switch (msg.cmd) {
    case 'init':         cmdInit(msg);        break;
    case 'clear':        cmdClear(msg);       break;
    case 'complete':     cmdComplete(msg);    break;
    case 'log':          cmdLog(msg);         break;
    case 'radar':        cmdRadar(msg);       break;
    case 'radar_terrain':cmdRadarTerrain(msg);break;
    case 'world_reset':  cmdWorldReset(msg);   break;
    case 'run_marker':   cmdRunMarker(msg);    break;
    case 'widget_rect':  cmdWidgetRect(msg);  break;
    case 'cinematic':    cmdCinematic(msg);   break;
    case 'skybox':       cmdSkybox(msg);      break;
    case 'colors':       cmdColors(msg);      break;
    case 'fx':           cmdFx(msg);          break;
    case 'ship_data':    cmdShipData(msg);    break;
    case 'target_data':  cmdTargetData(msg);  break;
    case 'text_msg':     cmdTextMsg(msg);     break;
    case 'text_active':  cmdTextActive(msg);  break;
    case 'red_alert':    cmdRedAlert(msg);    break;
    case 'red_alert_btn':cmdRedAlertBtn(msg); break;
    case 'comms_control':cmdCommsControl(msg);break;
    case 'comms_face':   cmdCommsFace(msg);   break;
    case 'comms_wf':     cmdCommsWf(msg);     break;
    case 'radar_zoom':   cmdRadarZoom(msg);   break;
    case 'comms_list':   cmdCommsList(msg);   break;
    case 'reticle':      cmdReticle(msg);     break;
    // Engine console widgets (helm / weapons / science) - see enginePanel().
    case 'throttle':        _pThrottle.cmd(msg);   break;
    case 'helm_move':       _pHelmMove.cmd(msg);   break;
    case 'shield_ctrl':     _pShield.cmd(msg);     break;
    case 'dock_ctrl':       _pDock.cmd(msg);       break;
    case 'mainscreen_ctrl': _pMainScreen.cmd(msg); break;
    case 'helm_jump':       _pHelmJump.cmd(msg);   break;
    case 'quick_jump':      _pQuickJump.cmd(msg);  break;
    case 'weapon_ctrl':     _pWeaponCtl.cmd(msg);  break;
    case 'beam_freq':       _pBeamFreq.cmd(msg);   break;
    case 'beam_speed':      _pBeamSpeed.cmd(msg);  break;
    case 'torp_conv':       _pTorpConv.cmd(msg);   break;
    case 'sci_list':        _pSciList.cmd(msg);    break;
    case 'sci_data':        _pSciData.cmd(msg);    break;
    case 'sci_tabs':        _pSciTabs.cmd(msg);    break;
    case 'sci_freq':        _pSciFreq.cmd(msg);    break;
    case 'story_dialog': cmdStoryDialog(msg); break;
    case 'hud_rect':     cmdHudRect(msg);     break;
    case 'batch':        msg.items.forEach(dispatch); break;
    default:             cmdWidget(msg);      break;
  }
}

function cmdLog(msg) {

// ── 2D tactical view overlay ─────────────────────────────────────────────────
const _radarCanvas = document.getElementById('radar-canvas');
const _radarCtx    = _radarCanvas ? _radarCanvas.getContext('2d') : null;

// widget_name → { left, top, right, bottom (0-100 %), ts: performance.now() }
const _widgetRects = new Map();
const _RECT_STALE_MS = 2000;   // hide a view after 2 s of no send_client_widget_rects calls

function _syncRadarCanvasSize() {
  if (!_radarCanvas) return;
  if (_radarCanvas.width  !== window.innerWidth)  _radarCanvas.width  = window.innerWidth;
  if (_radarCanvas.height !== window.innerHeight) _radarCanvas.height = window.innerHeight;
}
window.addEventListener('resize', _syncRadarCanvasSize);
_syncRadarCanvasSize();
// Zoom via scroll wheel anywhere on the page — radar canvas has pointer-events:none
// so the listener must live on window.
window.addEventListener('wheel', e => {
  // Over a console-widget overlay: it scrolls, or handles its own wheel (the steering
  // ring uses it for altitude). Before preventDefault, so native scrolling still works.
  if (_clickOnOverlay(e)) return;
  e.preventDefault();
  // Over the active 3dview (not the radar): zoom the orbit camera instead.
  if (_view3dActive && !_pointInRadarView(e.clientX, e.clientY)) {
    if (!_v3dManual) _v3dEnterManual();
    _v3dDist *= e.deltaY < 0 ? 0.9 : 1 / 0.9;
    _v3dDist = Math.max(100, Math.min(300000, _v3dDist));
    return;
  }
  _radarZoom *= e.deltaY < 0 ? 1.15 : 1 / 1.15;
  _radarZoom = Math.max(0.05, Math.min(20.0, _radarZoom));
  _requestRadarRender();
}, { passive: false });

// ── Drag-pan of the radar ─────────────────────────────────────────────────────
// Works on both the 2D-view widget radar and the corner/GM radar. A small drag
// threshold means plain clicks still fall through to the UI underneath — only an
// actual drag starts a pan and swallows the event.
function _currentRadarViews() {
  const activeViews = Array.from(_widgetRects.values());
  if (activeViews.length > 0) return { views: activeViews, isCorner: false };
  // No console 2D view: only the corner radar provides an interaction zone, and
  // only when it's enabled — otherwise there's nothing to hit-test.
  if (!_cornerRadarEnabled) return { views: [], isCorner: false };
  return { views: [_cornerRect(_radarCanvas.width, _radarCanvas.height)], isCorner: true };
}

function _pointInRadarView(px, py) {
  const W = _radarCanvas.width, H = _radarCanvas.height;
  const { views, isCorner } = _currentRadarViews();
  for (const rect of views) {
    const box = _radarBox(W, H, rect, isCorner);
    if (box && px >= box.bx0 && px <= box.bx0 + box.bw &&
        py >= box.by0 && py <= box.by0 + box.bh) return true;
  }
  return false;
}

let _panArmed = false, _panDownX = 0, _panDownY = 0;

// Long-press = hold the left button still for _LONG_PRESS_MS → the engine's hold_click
// (same as a right-click). Cancelled if the press turns into a drag-pan.
const _LONG_PRESS_MS = 500;
let _longPressTimer = null, _longPressFired = false;

// Mount a console-widget overlay in the game area. gui-root, NOT document.body: body is
// position:fixed and sits under the mock topbar, while gui-root is position:absolute so
// percent coords match send_gui_*. Everything mounted here is tagged `engine-panel`,
// which is what keeps the radar's window-level handlers off it (below) - tagging at the
// mount point means a NEW overlay is excluded automatically instead of having to be
// remembered in a list, which is how the throttle and helm ring lost their clicks.
function _mountOverlay(el) {
  el.classList.add('engine-panel');
  (document.getElementById('gui-root') || document.body).appendChild(el);
  return el;
}

// An interaction with an overlay control (throttle, steering ring, comms panels, zoom
// buttons, red alert) must NOT reach the 2D view underneath, even though it sits over it
// geometrically: the radar's select / pan / zoom / recentre handlers are all on `window`.
function _clickOnOverlay(e) {
  const t = e.target;
  return !!(t && t.closest && t.closest('.engine-panel'));
}

window.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (_clickOnOverlay(e)) return;
  if (!_pointInRadarView(e.clientX, e.clientY)) return;
  // Arm — but don't claim the event yet, so a plain click still reaches widgets.
  _panArmed = true; _panning = false;
  _panDownX = e.clientX; _panDownY = e.clientY;
  _panStartPX = _radarPanX; _panStartPZ = _radarPanZ;
  _longPressFired = false;
  clearTimeout(_longPressTimer);
  _longPressTimer = setTimeout(() => {
    if (_panArmed && !_panning) {   // still held, not dragging → long-press
      _longPressFired = true;
      _radarSelectAt(_panDownX, _panDownY, 'rmb');
    }
  }, _LONG_PRESS_MS);
});

window.addEventListener('mousemove', e => {
  if (_panArmed && !_panning &&
      Math.abs(e.clientX - _panDownX) + Math.abs(e.clientY - _panDownY) > 4) {
    _panning = true;
    clearTimeout(_longPressTimer);   // a drag cancels the pending long-press
    document.body.style.cursor = 'grabbing';
  }
  if (_panning) {
    const dx = e.clientX - _panDownX;
    const dy = e.clientY - _panDownY;
    // Grab-the-map: the world point under the cursor follows it. +Z is up, +X right.
    _radarPanX = _panStartPX - dx * _lastWorldPerPx;
    _radarPanZ = _panStartPZ + dy * _lastWorldPerPx;
    _requestRadarRender();
    e.preventDefault();
    return;
  }
  // Hover hint over a pannable radar.
  if (_pointInRadarView(e.clientX, e.clientY)) document.body.style.cursor = 'grab';
  else if (document.body.style.cursor === 'grab') document.body.style.cursor = '';
});

window.addEventListener('mouseup', e => {
  const armed = _panArmed, wasPanning = _panning, longFired = _longPressFired;
  _panArmed = false; _panning = false;
  clearTimeout(_longPressTimer);
  document.body.style.cursor = '';
  // A clean left-click (armed inside a radar view, no drag, no long-press already
  // fired) → object selection.
  if (wasPanning || !armed || e.button !== 0 || longFired) return;
  _radarSelectAt(e.clientX, e.clientY, 'lmb');
});

// Right-click inside a 2D view → selection with the rmb button (the //focus/comms
// click-to-move / galaxy-theater "Close on empty" path reads extra_extra_tag).
window.addEventListener('contextmenu', e => {
  if (_clickOnOverlay(e)) return;
  if (!_pointInRadarView(e.clientX, e.clientY)) return;
  if (_currentRadarViews().isCorner) return;
  e.preventDefault();
  _radarSelectAt(e.clientX, e.clientY, 'rmb');
});

// Double-click recentres the radar (clears the pan offset).
window.addEventListener('dblclick', e => {
  if (_clickOnOverlay(e)) return;
  if (!_pointInRadarView(e.clientX, e.clientY)) return;
  _radarPanX = 0; _radarPanZ = 0;
  _requestRadarRender();
  e.preventDefault();
});

// Pick the nearest radar object to a click and fire a selection event, mirroring
// the engine's 2D-view select. The runner turns this into a `select_space_object`
// event; consoledispatcher.py routes it to comms / science by the console NAME.
// An empty-space click selects id 0 (still carries source_point + button, which the
// //focus/comms camera-pan path uses).
const _PICK_PX_THRESHOLD = 20;
function _radarSelectAt(px, py, button) {
  const { views, isCorner } = _currentRadarViews();
  if (isCorner || views.length === 0 || !_pickState) return;
  if (!_pointInRadarView(px, py)) return;
  const { cx, cz, halfSpan, box } = _pickState;
  const proj = _radarProj(box, cx, cz, halfSpan);
  let bestId = 0, bestD = _PICK_PX_THRESHOLD;
  const consider = (id, wx, wz) => {
    const d = Math.hypot(proj.toX(wx) - px, proj.toY(wz) - py);
    if (d < bestD) { bestD = d; bestId = id; }
  };
  // Skip objects with selectable==0 (nosel): asteroids, individual nebula — visible but
  // not clickable. (Invisible cambots are already absent from the stream entirely.)
  for (const [id, idx] of _dynamicMap) {
    if (idx >= _dynamicCount) continue;

// ── Radar colour mode: SIDE vs DIPLOMACY (viewer-relative) ────────────────────────

// ── Ship sprite cache ─────────────────────────────────────────────────────────
// Dynamic objects draw their top-down art (/ships/<art>256.png) on the radar.
// Plain HTMLImageElements (for 2D-canvas drawImage); the Three-only _loadTex
// helper can't be reused here. Returns the cached <img> once decoded, else null.
// Rotation to add so a sprite's "nose" aligns with its heading. Cosmos top-down
// art points down (south) — i.e. the nose is 180° from the heading vector — so
// add π. Adjust here if a given art set points elsewhere.
const _SPRITE_ART_OFFSET = Math.PI;
const _spriteCache = new Map();   // art root → { img, ready }
function _shipSprite(art) {
  if (!art) return null;
  let e = _spriteCache.get(art);
  if (e === undefined) {
    e = { img: new Image(), ready: false };
    e.img.onload  = () => { e.ready = true; _requestRadarRender(); };
    e.img.onerror = () => { e.ready = false; };   // 404 / no art → dot fallback
    e.img.src = `/ships/${art}256.png`;
    _spriteCache.set(art, e);
  }
  return e.ready ? e.img : null;
}

// The 256.png art is white-on-transparent; tint it with the object's side colour
// (both to make it visible and to convey allegiance). Cached per art+colour.
const _tintCache = new Map();   // "art|color" → canvas
function _tintedSprite(art, color) {
  const img = _shipSprite(art);
  if (!img) return null;
  const key = art + '|' + color;
  let c = _tintCache.get(key);
  if (c) return c;
  const w = img.naturalWidth || 256, h = img.naturalHeight || 256;
  c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'multiply';      // white → colour, keep any shading
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in'; // restore the sprite's alpha mask
  g.drawImage(img, 0, 0);
  _tintCache.set(key, c);
  return c;
}

// Some 2D-view widgets (e.g. helm) arrive with an empty/degenerate rect — there's
// no explicit layout size — which would hide the radar entirely. Fall back to a
// full-panel default so it still renders.
const _DEFAULT_2D_VIEW_RECT = { left: 0, top: 3, right: 100, bottom: 100 };
function _resolve2dViewRect(left, top, right, bottom) {
  if (right - left < 1 || bottom - top < 1) return { ..._DEFAULT_2D_VIEW_RECT };
  return { left, top, right, bottom };

// ── cmdWidgetRect — store 2D view position from send_client_widget_rects ──────
function cmdWidgetRect(msg) {

    log(`widget_rect IGNORED cid=${msg.clientID} mine=${CLIENT_ID} widget=${msg.widget}`, 'dbg');
    return;

  log(`widget_rect OK cid=${msg.clientID} widget=${msg.widget} (${msg.left},${msg.top})→(${msg.right},${msg.bottom})`, 'dbg');
  const r = _resolve2dViewRect(msg.left, msg.top, msg.right, msg.bottom);

function _cssToRGB(css) {

    // it over the side colour so the galaxy board's kind/health tints render.

// ── Engine console widget panels (Family B) ──────────────────────────────────
// gui_console()/gui_layout_widget() name native C++ views the real engine paints into
// a reserved rectangle; nothing about their CONTENT crosses the MAST boundary. Here
// each is a DOM overlay in that rectangle, fed by a per-tick stream from the mock.
//
// They share enginePanel() because they all need the same four things: lazy creation,
// placement, hide, and merging the PARTIAL payloads _push_delta sends (only changed
// fields are on the wire, so state has to be retained here).
//
// Placement arrives one of two ways:
//   op:'rect'    — screen percent, from a mission's gui_layout_widget. Comms, science
//                  and engineering lay themselves out this way.
//   op:'defrect' — anchor corner + CAPTURE PIXELS, the mock's built-in default for the
//                  two consoles the engine lays out in C++ and never tells us about
//                  (helm, weapons). Scaled by viewport HEIGHT and pinned to the named
//                  corner, so proportions measured off an engine capture survive a
//                  differently shaped window instead of stretching.
// A defrect resets any stored rect and vice versa, so a console change can't leave a
// widget wearing the previous console's placement.
const _enginePanels = [];
const EP_BG   = 'rgba(10,14,28,.86)';
const EP_EDGE = '#3a4570';
const EP_FG   = '#b9c2f0';
const EP_SEL  = '#aeb6e8';

// Rebuilding a panel's DOM between mousedown and mouseup destroys the node the press
// started on; the browser then fires `click` on a surviving ancestor, the delegated
// [data-act] lookup finds nothing, and the press vanishes. The throttle re-renders on
// EVERY tick once the ship is moving (SPD changes), which is why it took exactly one
// click and then looked dead - the bar, WARP and REV alike. So: hold renders while a
// button is down, and flush after the click has been dispatched.
let _epPressing = false;
const _epPending = new Set();
window.addEventListener('mousedown', () => { _epPressing = true; }, true);
window.addEventListener('mouseup', () => {
  _epPressing = false;
  // setTimeout, not here: `click` is dispatched right after mouseup in this same task,
  // and rebuilding before it lands would drop the press exactly as before.
  setTimeout(() => {
    for (const p of _epPending) p.redraw();
    _epPending.clear();
  }, 0);
}, true);

// Write only when the markup actually differs. A panel whose payload changed in a field
// it does not draw (or not at all) then keeps its nodes, which keeps hover state and
// keeps churn off the main thread.
function _epSet(el, html) {
  if (el._epHtml === html) return;
  el._epHtml = html;
  el.innerHTML = html;
}

function enginePanel(id, css, render, onAct) {
  // The panel's own display mode, so place() can show it WITHOUT overwriting the
  // display:flex most of them rely on to fill their rectangle.
  const disp = (css.match(/display\s*:\s*([\w-]+)/) || [, 'block'])[1];
  const p = {
    el: null, rect: null, def: null, state: {}, disp,
    ensure() {
      if (p.el) return p.el;
      const el = document.createElement('div');
      el.id = id;
      // gui-root, NOT document.body: gui-root is the game area below the mock topbar
      // and is position:absolute, so percent coords match send_gui_* exactly.
      el.style.cssText = 'position:absolute;z-index:47;display:none;box-sizing:border-box;' +
        'font:12px/1.35 monospace;color:' + EP_FG + ';' + css;
      _mountOverlay(el);
      if (onAct) el.addEventListener('click', (ev) => {
        // Delegated: render() rebuilds innerHTML, which would drop per-element
        // listeners. Actions are declared with data-act instead.
        const hit = ev.target.closest('[data-act]');
        if (hit && !hit.hasAttribute('data-off')) onAct(hit.getAttribute('data-act'), hit, p.state);
      });
      p.el = el;
      return el;
    },
    place() {
      const el = p.ensure();
      if (p.rect) {
        const r = p.rect;
        el.style.left = r.left + '%';
        el.style.top = r.top + '%';
        el.style.width = Math.max(0, r.right - r.left) + '%';
        el.style.height = Math.max(0, r.bottom - r.top) + '%';
        el.style.display = p.disp;
        return true;
      }
      if (p.def) {
        const d = p.def;
        const host = document.getElementById('gui-root') || document.body;
        const W = host.clientWidth || window.innerWidth;
        const H = host.clientHeight || window.innerHeight;
        const s = H / (d.refh || 1355);   // uniform scale — never distort the capture
        const w = d.w * s, h = d.h * s, dx = d.dx * s, dy = d.dy * s;
        el.style.left = ((d.anchor[1] === 'l') ? dx : W - dx - w) + 'px';
        el.style.top = ((d.anchor[0] === 't') ? dy : H - dy - h) + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.display = p.disp;
        return true;
      }
      el.style.display = 'none';
      return false;
    },
    cmd(msg) {
      if (msg.op === 'hide' || msg.active === false) {
        if (p.el) p.el.style.display = 'none';
        return;
      }
      if (msg.op === 'rect') { p.rect = { left: msg.left, top: msg.top, right: msg.right, bottom: msg.bottom }; p.def = null; }
      else if (msg.op === 'defrect') { p.def = msg; p.rect = null; }
      else if (msg.op === 'list') { p.state.items = msg.items || []; }
      else { Object.assign(p.state, msg); }
      if (!p.place()) return;
      if (_epPressing) { _epPending.add(p); return; }
      render(p.el, p.state);
    },
    redraw() { if (p.place()) render(p.el, p.state); },
  };
  _enginePanels.push(p);
  return p;
}

// A defrect is resolved against the live viewport, so it has to be re-resolved when
// the window changes shape. Percent rects reflow on their own.
window.addEventListener('resize', () => {
  for (const p of _enginePanels) if (p.def && p.el && p.el.style.display !== 'none') p.redraw();
});

function _epCtl(type, detail) {
  sendEvent(type, '', CLIENT_ID !== null ? CLIENT_ID : 0, detail);
}
function _epBtn(label, act, on, off) {
  // The engine's button look: dark slab, lavender text, filled + dark text when active.
  return '<div data-act="' + act + '"' + (off ? ' data-off="1"' : '') +
    ' style="flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;' +
    'border:1px solid ' + EP_EDGE + ';border-radius:3px;cursor:' + (off ? 'default' : 'pointer') + ';' +
    'padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' +
    (on ? 'background:' + EP_SEL + ';color:#0b1020;font-weight:700;'
        : 'background:rgba(30,38,70,.7);' + (off ? 'color:#5a6288;' : '')) + '">' + label + '</div>';

function _epTitle(t) {

// ── throttle ─────────────────────────────────────────────────────────────────
// The engine widget is a vertical bar with a SPD readout, a WARP button on top and REV
// at the bottom; those two buttons change what the BAR MEANS rather than setting a speed
// (ENGINE_WIDGETS.md: "REV and WARP buttons toggle how the bar is used").  Three modes:
//
//   impulse  18 segments, click one for playerThrottle 0..1 as a fraction of the bar
//   reverse  the same bar read as 0..-1 (REV); -1 is full astern
//   warp     FOUR sections, warp 1-4 = playerThrottle 2,3,4,5
//
// All three write `playerThrottle`, which is all the engine widget does, so a mission
// polling it sees what it would see in Cosmos.  The WARP band is offered only when the
// hull's data_set `warp` == 1.0.
const THROTTLE_SEGS = 18;
// Warp band colours, bottom-up (warp 1 -> 4), matching the engine's warp-mode bar.
const WARP_COLORS = ['#22d3d3', '#2a44d0', '#d8d322', '#d02a2a'];

function _throttleMode(s) {
  // Reality wins over the local toggle: a ship already at warp (or astern) shows the bar
  // that describes it, so the widget can never disagree with the ship it is driving.
  const thr = s.throttle || 0;
  if (thr > 1) return 'warp';
  if (thr < 0) return 'rev';
  return s.mode || 'impulse';
}

const _pThrottle = enginePanel('epThrottle',
  'background:' + EP_BG + ';border:1px solid ' + EP_EDGE + ';border-radius:4px;' +
  'display:flex;flex-direction:column;padding:2px;gap:2px;',
  (el, s) => {
    const thr = s.throttle || 0, mode = _throttleMode(s);
    let h = '<div style="flex:0 0 auto;text-align:center;font-size:11px;color:#cfd6ff;">SPD ' +
      (s.speed == null ? '0' : s.speed) + '</div>';
    h += '<div style="flex:0 0 22px;display:flex;">' +
      _epBtn('WARP', 'warp', mode === 'warp', !s.warp_ok) + '</div>';
    // column-reverse so index 0 is the BOTTOM of the bar, as the engine draws it.
    h += '<div style="flex:1 1 auto;display:flex;flex-direction:column-reverse;gap:1px;min-height:0;">';
    if (mode === 'warp') {
      const level = Math.max(1, Math.min(4, Math.round(thr) - 1));   // pt 2..5 -> warp 1..4
      for (let i = 0; i < 4; i++) {
        const on = (i + 1) === level;
        h += '<div data-act="w' + (i + 1) + '" style="flex:1 1 0;min-height:2px;cursor:pointer;' +
          'display:flex;align-items:center;justify-content:center;font:700 11px monospace;' +
          'color:#0b1020;background:' + WARP_COLORS[i] + ';' +
          (on ? 'box-shadow:inset 0 0 0 2px #fff;' : 'opacity:.55;') + '">' + (i + 1) + '</div>';
      }
    } else {
      // Reverse reads the same bar as 0..-1, so the lit fraction is |throttle| either way.
      const lit = Math.min(1, Math.abs(thr));
      for (let i = 0; i < THROTTLE_SEGS; i++) {
        const frac = (i + 1) / THROTTLE_SEGS;         // this segment's share of the bar
        const on = frac <= lit + 1e-6;
        const hue = 90 - 60 * frac;                   // green at rest -> yellow at full
        h += '<div data-act="t' + frac.toFixed(4) + '" style="flex:1 1 0;min-height:2px;' +
          'cursor:pointer;background:' +
          (on ? 'hsl(' + hue + ',85%,45%)' : 'rgba(40,48,80,.55)') + ';"></div>';
      }
    }
    h += '</div>';
    h += '<div style="flex:0 0 22px;display:flex;">' +
      _epBtn('REV', 'rev', mode === 'rev') + '</div>';
    _epSet(el, h);
  },
  (act, node, s) => {
    const mode = _throttleMode(s);
    // Set the throttle AND adopt the value locally. _throttleMode re-derives the mode
    // from s.throttle, which the server only refreshes on its next push - so without the
    // optimistic write, leaving warp redrew the warp bar anyway for ~200ms and a second
    // click just toggled the mode back. The next push confirms or corrects it.
    const set = (v) => { s.throttle = v; _epCtl('helm_control', { key: 'playerThrottle', value: v }); };
    if (act === 'warp' || act === 'rev') {
      // A mode button only changes what the bar MEANS. But leaving a mode while the ship
      // sits in its range would leave the bar unable to describe the current speed, so
      // the throttle is pulled back into the new mode's range.
      const want = act === 'warp' ? 'warp' : 'rev';
      s.mode = (mode === want) ? 'impulse' : want;
      if (mode === 'warp' && s.mode !== 'warp' && (s.throttle || 0) > 1) set(1);
      else if (mode === 'rev' && s.mode !== 'rev' && (s.throttle || 0) < 0) set(0);
      _pThrottle.redraw();
      return;
    }
    // 'w1'-'w4' are the warp sections; checked before the 't' segments and after the
    // 'warp' button above, which also begins with a w.
    if (act[0] === 'w') {
      set(parseInt(act.slice(1), 10) + 1);         // warp 1-4 -> playerThrottle 2-5
      _pThrottle.redraw();
      return;
    }
    if (act[0] === 't') {
      const frac = parseFloat(act.slice(1));
      set(+(mode === 'rev' ? -frac : frac).toFixed(4));
      _pThrottle.redraw();
    }
  });

// ── helm_movement ────────────────────────────────────────────────────────────
// The steering ring (screen_shots/helm_movement.png): an ellipse in perspective with
// ANG/ALT/AZI readouts and surrounding contacts as markers. Click or drag the ring to
// pick a heading; the vertical strip on the right nudges the target altitude.
// Both write steerToDirD{X,Y,Z} + steeringToDirFlag, which the mock's _playership_drive
// already honors (it is the same channel the autoplay AI steers through).
const _pHelmMove = enginePanel('epHelmMove',
  'background:' + EP_BG + ';border:1px solid ' + EP_EDGE + ';border-radius:4px;padding:2px;',
  (el, s) => {
    let c = el.querySelector('canvas');
    if (!c) {
      el.innerHTML = '<canvas style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;"></canvas>';
      c = el.querySelector('canvas');
      c.addEventListener('mousedown', (ev) => _helmRingAim(c, ev));
      c.addEventListener('mousemove', (ev) => { if (ev.buttons & 1) _helmRingAim(c, ev); });
      c.addEventListener('wheel', (ev) => {
        // Wheel = altitude, the ALT half of the widget. 200u per notch.
        ev.preventDefault();
        _epCtl('helm_steer', { alt: (s.alt || 0) - Math.sign(ev.deltaY) * 200 });
      }, { passive: false });
    }
    const w = c.clientWidth || 1, h = c.clientHeight || 1;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, rx = w * 0.42, ry = h * 0.30;
    ctx.strokeStyle = '#8f98c8';
    for (const k of [0.34, 0.66]) {           // the inner rings
      ctx.beginPath(); ctx.ellipse(cx, cy, rx * k, ry * k, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = '#c0392b';              // the outer heading ring, as in the engine
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    // Contacts, placed by bearing on the ring. _dynamicMeta is the same object set the
    // 2D radar draws, so the ring agrees with the radar without a second stream.
    // _dynamicMap holds a BUFFER INDEX, not a position: x is [i*3], world z is [i*3+1].
    const me = _myShipId, mineIdx = me == null ? undefined : _dynamicMap.get(me);
    if (mineIdx !== undefined && _dynamicPosBuf) {
      const mx = _dynamicPosBuf[mineIdx * 3], mz = _dynamicPosBuf[mineIdx * 3 + 1];
      for (const [id, meta] of _dynamicMeta) {
        if (id === me) continue;
        const i = _dynamicMap.get(id);
        if (i === undefined) continue;
        const a = Math.atan2(_dynamicPosBuf[i * 3] - mx, _dynamicPosBuf[i * 3 + 1] - mz);
        const px = cx + Math.sin(a) * rx, py = cy - Math.cos(a) * ry;
        ctx.fillStyle = _objColor(meta.side, meta.tint);
        ctx.fillRect(px - 4, py - 4, 8, 8);
      }
    }
    // Own ship at the centre, and the heading spoke.
    const ang = (s.ang || 0) * Math.PI / 180;
    ctx.strokeStyle = '#2ecc40'; ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(ang) * rx, cy - Math.cos(ang) * ry); ctx.stroke();
    ctx.fillStyle = '#2ecc40';
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = '13px monospace'; ctx.fillStyle = EP_FG;
    ctx.textAlign = 'left'; ctx.fillText('ANG ' + Math.round(s.ang || 0), 4, 14);
    ctx.textAlign = 'right'; ctx.fillText('ALT ' + Math.round(s.alt || 0), w - 4, 14);
    ctx.textAlign = 'left'; ctx.fillText('AZI ' + Math.round(s.azi || 0), 4, h - 4);
    if (s.steering) { ctx.textAlign = 'right'; ctx.fillStyle = '#2ecc40'; ctx.fillText('AUTO', w - 4, h - 4); }
  });

function _helmRingAim(c, ev) {
  const r = c.getBoundingClientRect();
  const dx = (ev.clientX - r.left) - r.width / 2;
  const dy = (ev.clientY - r.top) - r.height / 2;
  // Undo the ring's perspective squash so a click reads as the heading it looks like.
  const ang = (Math.atan2(dx / (r.width * 0.42 || 1), -dy / (r.height * 0.30 || 1)) * 180 / Math.PI + 360) % 360;
  _epCtl('helm_steer', { ang: +ang.toFixed(1) });
}

// ── cmdRadar — delta update for active (NPC/PLAYER) objects ──────────────────
function cmdFx(msg) {
  // Transient combat visuals for the radar overlay: beam-fire lines and
  // projectile dots (replaced wholesale each push).
  _radarBeams       = msg.beams       || [];
  _radarProjectiles = msg.projectiles || [];
}

function cmdRadar(msg) {
  if (!_radarCtx) return;

  // Always process nav + focus — needed to discover our own ship_id before the
  // first matching per-ship message arrives.
  if (msg.navpoints !== undefined) _radarNavpoints = msg.navpoints;
  if (msg.navareas  !== undefined) _radarNavareas  = msg.navareas;
  if (msg.client_focus) {
    // Server sends complete client_focus each tick — replace rather than merge
    // so stale entries for disconnected clients are cleared automatically.
    _radarClientFocus = msg.client_focus;
    const myKey = CLIENT_ID !== null ? String(CLIENT_ID) : '0';
    const entry = msg.client_focus[myKey];
    if (entry && entry.ship_id) _myShipId = entry.ship_id;
  }

  // Per-ship filter: only process the object delta for our assigned ship.
  // ship_id "0" = GM / server view, consumed by unassigned clients (lobby/spectator).
  const msgShipId = msg.ship_id || '0';
  const isGMView    = msgShipId === '0';
  const isMyShip    = _myShipId !== null && msgShipId === _myShipId;
  const isUnassigned = _myShipId === null;

  if ((!isGMView && !isMyShip) || (isGMView && !isUnassigned)) {
    // Not our message — nav/focus already updated; redraw for camera lerp.
    _requestRadarRender();
    return;
  }

  if (_dynamicPoints) {
    const removed = msg.removed || [];
    const changed  = msg.changed  || [];

    for (const id of removed) {
      const idx = _dynamicMap.get(id);
      if (idx === undefined) continue;
      _dynamicMap.delete(id);
      _dynamicMeta.delete(id);
      _dynamicRevMap.delete(idx);
      _dispQuat.delete(id);   // drop the smoothed-heading entry for this object
      _dynamicCount--;
      if (idx !== _dynamicCount && _dynamicCount > 0) {
        // Move last element into the vacated slot.
        const srcBase = _dynamicCount * 3;
        const dstBase = idx * 3;
        _dynamicPosBuf[dstBase]     = _dynamicPosBuf[srcBase];
        _dynamicPosBuf[dstBase + 1] = _dynamicPosBuf[srcBase + 1];
        _dynamicPosBuf[dstBase + 2] = _dynamicPosBuf[srcBase + 2];
        _dynamicDispBuf[dstBase]     = _dynamicDispBuf[srcBase];   // keep smoothed buf aligned
        _dynamicDispBuf[dstBase + 1] = _dynamicDispBuf[srcBase + 1];
        _dynamicDispBuf[dstBase + 2] = _dynamicDispBuf[srcBase + 2];
        _dynamicColBuf[dstBase]     = _dynamicColBuf[srcBase];
        _dynamicColBuf[dstBase + 1] = _dynamicColBuf[srcBase + 1];
        _dynamicColBuf[dstBase + 2] = _dynamicColBuf[srcBase + 2];
        const movedId = _dynamicRevMap.get(_dynamicCount);
        if (movedId !== undefined) {
          _dynamicMap.set(movedId, idx);
          _dynamicRevMap.set(idx, movedId);
          _dynamicRevMap.delete(_dynamicCount);
        }
      }
    }

    let colorsDirty = false;
    for (const o of changed) {
      let idx = _dynamicMap.get(o.id);
      const isNew = idx === undefined;   // client is allocating a fresh slot
      if (idx === undefined) {
        // Never invent identity from a DELTA record. A delta carries only pose
        // (x/z/y/fx/fz/q/shields) -- no art, meshscale, side, tick_type, exhaust or
        // beamports -- and those ride the `new` record ONLY, so a slot built from a
        // delta keeps art:'' and beamports:null for the object's whole life: invisible
        // in the 3D view, no beams, wrong radar colour. Skipping instead leaves the
        // object absent until the server re-sends a full record, which is recoverable.
        if (!o.new && o.art === undefined) {
          _deltaOrphans++;
          if (_deltaOrphans === 1)
            console.warn('[radar] delta for unknown id ' + o.id +
                         ' - skipped rather than synthesising blank meta (server should re-send a full record)');
          // Self-heal: ask the server to drop this id from its delta baseline so the
          // next push carries a FULL record. Without this a full record lost to a
          // reload race or a dropped send means the object is missing for the whole
          // run - the "enemies stop moving on run 2" symptom. Batched + sent at most
          // once a second so a persistent fault cannot flood the socket.
          _resyncWanted.add(o.id);
          continue;
        }
        if (_dynamicCount >= _MAX_DYNAMIC) continue;
        idx = _dynamicCount++;
        _dynamicMap.set(o.id, idx);
        _dynamicRevMap.set(idx, o.id);
        const {r, g, b} = _cssToRGB(_objColor(o.side, null));
        const cb = idx * 3;
        _dynamicColBuf[cb] = r; _dynamicColBuf[cb+1] = g; _dynamicColBuf[cb+2] = b;
        colorsDirty = true;
        _dynamicMeta.set(o.id, {
          side: o.side, tick_type: o.tick_type,
          fx: o.fx ?? 0, fz: o.fz ?? 0, name: o.name || '', art: o.art || '',
          y: o.y ?? 0, meshscale: o.meshscale ?? 1, scale: o.scale || null, q: o.q || null,
          exhaust: o.exhaust || null,   // engine-port local positions (for the 3dview smoke trail)
          beamports: o.beamports || null,   // beam-emitter local positions (for 3dview beam origins)
          shp: o.shp ?? -1, shpf: o.shpf ?? -1, shpa: o.shpa ?? -1, nosel: !!o.nosel,
        });
      } else {
        const meta = _dynamicMeta.get(o.id);
        if (meta && o.fx !== undefined) { meta.fx = o.fx; meta.fz = o.fz; }
        if (meta && o.q) meta.q = o.q;
        if (meta && o.shp !== undefined) meta.shp = o.shp;
        if (meta && o.shpf !== undefined) meta.shpf = o.shpf;
        if (meta && o.shpa !== undefined) meta.shpa = o.shpa;
        if (meta && o.y !== undefined) meta.y = o.y;   // altitude (3D view height)
      }
      const pb = idx * 3;
      _dynamicPosBuf[pb]     = o.x;
      _dynamicPosBuf[pb + 1] = o.z;
      _dynamicPosBuf[pb + 2] = 0;
      if (isNew) {
        // Snap the smoothed buffer to a brand-new object so it doesn't ease in
        // from a stale slot / the origin; existing objects ease toward o.x/o.z.
        _dynamicDispBuf[pb]     = o.x;
        _dynamicDispBuf[pb + 1] = o.z;
        _dynamicDispBuf[pb + 2] = 0;
      }
    }

    _dynamicPoints.geometry.setDrawRange(0, _dynamicCount);
    _dynamicPoints.geometry.attributes.position.needsUpdate = true;
    if (colorsDirty) _dynamicPoints.geometry.attributes.color.needsUpdate = true;
  }

  _requestRadarRender();
}

// ── Radar layout helpers ──────────────────────────────────────────────────────
function _cornerRect(W, H) {
  const margin = 12, sz = Math.min(W, H) * 0.28;
  return {
    left:   (W - sz - margin) / W * 100,
    top:    (H - sz - margin) / H * 100,
    right:  (W - margin) / W * 100,
    bottom: (H - margin) / H * 100,
  };
}

function _rectPx(W, H, rect) {
  return {
    x0: rect.left  / 100 * W,  y0: rect.top    / 100 * H,
    x1: rect.right / 100 * W,  y1: rect.bottom / 100 * H,
  };
}

function _computeWorldBounds(focusX, focusZ) {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  if (_dynamicPosBuf) {
    for (let i = 0; i < _dynamicCount; i++) {
      const b = i * 3;
      const wx = _dynamicPosBuf[b], wz = _dynamicPosBuf[b + 1];
      if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
      if (wz < minZ) minZ = wz; if (wz > maxZ) maxZ = wz;
    }
  }
  // Terrain must also contribute to the auto-fit so zooming the corner radar
  // correctly reveals asteroid fields and other static objects spread across
  // the scene, not just the dynamic-object cluster.
  if (_terrainPosBuf) {
    for (let i = 0; i < _terrainCount; i++) {
      const b = i * 3;
      const wx = _terrainPosBuf[b], wz = _terrainPosBuf[b + 1];
      if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
      if (wz < minZ) minZ = wz; if (wz > maxZ) maxZ = wz;
    }
  }
  for (const n of _radarNavpoints) {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    const nz = n.z ?? 0;
    if (nz < minZ) minZ = nz; if (nz > maxZ) maxZ = nz;
  }
  if (!isFinite(minX)) { minX = -5000; maxX = 5000; minZ = -5000; maxZ = 5000; }
  let cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  if (focusX != null && isFinite(focusX)) {
    cx = focusX;
    cz = focusZ;
  } else {
    // Fallback: center on first PLAYER-type object when client_focus not yet received.
    for (const [id, meta] of _dynamicMeta) {
      if (meta.tick_type === 'PLAYER' || meta.tick_type === 'player') {
        const idx = _dynamicMap.get(id);
        if (idx !== undefined && idx < _dynamicCount) {
          const b = idx * 3;
          cx = _dynamicPosBuf[b];
          cz = _dynamicPosBuf[b + 1];
          break;
        }
      }
    }
  }
  // Inside a 2D view widget, pin halfSpan to CULL_RADIUS so the radar shows the
  // ship's local neighbourhood at a fixed scale instead of auto-fitting the entire
  // visible object set (which makes any movement imperceptible).
  const hasActiveView = _widgetRects.size > 0;
  const halfSpan = (hasActiveView && focusX != null)
    ? 35_000 / _radarZoom
    : Math.max(maxX - minX, maxZ - minZ, 1000) * 0.675 / _radarZoom;
  // Anchor for the range rings = the tracked centre (ship / centroid) before pan,
  // so the rings slide with the world when panning instead of staying screen-locked.
  const ax = cx, az = cz;
  // Drag-pan offset (world units) — applied to whichever radar is on screen
  // (2D-view or corner). Double-click clears it back to the tracked centre.
  cx += _radarPanX;
  cz += _radarPanZ;
  return { cx, cz, halfSpan, ax, az };
}

// Pixel box the world is projected into, shared by the 2D chrome/overlay, the
// Three.js viewport and the pan hit-test so terrain dots, dynamic dots, arrows,
// navpoints and rings all occupy the same coordinate space and clip identically.
//   • corner radar  → framed, aspect-locked square with a label header
//   • 2D-view widget → the entire widget rect (uniform world scale, so range
//     rings stay circular and the longer axis simply shows more world)
// Returns { bx0, by0, bw, bh, fit } in 2D-canvas pixels, or null if too small.
// `fit` is the dimension the outer range ring (radius halfSpan) maps to.
function _radarBox(W, H, rect, isCorner) {
  const { x0, y0, x1, y1 } = _rectPx(W, H, rect);
  const rw = x1 - x0, rh = y1 - y0;
  if (rw < 4 || rh < 4) return null;
  if (isCorner) {
    const pad    = Math.min(rw, rh) * 0.05 + 6;
    const labelH = Math.max(18, rh * 0.08);
    const drawH  = rh - labelH - 2 * pad;
    const drawW  = rw - 2 * pad;
    const S      = Math.min(drawW, drawH);
    return { bx0: x0 + pad, by0: y0 + labelH + pad + (drawH - S), bw: S, bh: S, fit: S };
  }
  return { bx0: x0, by0: y0, bw: rw, bh: rh, fit: Math.min(rw, rh) };
}

// Uniform-scale world→pixel projection for a box. The outer ring (radius
// halfSpan) maps to fit/2 px; the longer box axis shows proportionally more world.
// ── selection reticle ────────────────────────────────────────────────────────
// How a 2D view shows what the console has selected: a reticle from reticle-set.png in
// that console's colour from preferences.json (gui-color-{weapon,science,comms}-reticle),
// sized by lock-reticle-size-2D.
//
// The sheet is a 5x4 grid of 266px cells, and the art is BLACK line work on transparent -
// so recolouring has to be a source-in fill. A multiply (what the white-on-transparent
// grid-icon-sheet uses) would leave every reticle black.
const _RETICLE_COLS = 5, _RETICLE_CELL = 266;
let _reticleImg = null, _reticleReady = false;
const _reticleTinted = new Map();    // "cell|colour" -> pre-tinted canvas
let _reticle = null;                 // {id, color, size, cell}

(function _loadReticleSheet() {
  const img = new Image();
  img.onload = () => { _reticleReady = true; _requestRadarRender(); };
  img.onerror = () => console.error('[reticle] failed to load reticle-set.png');
  img.src = 'reticle-set.png';
  _reticleImg = img;
})();

function _reticleSprite(cell, color) {
  const key = cell + '|' + color;
  const hit = _reticleTinted.get(key);
  if (hit) return hit;
  if (!_reticleReady) return null;
  const c = document.createElement('canvas');
  c.width = c.height = _RETICLE_CELL;
  const g = c.getContext('2d');
  const sx = (cell % _RETICLE_COLS) * _RETICLE_CELL;
  const sy = Math.floor(cell / _RETICLE_COLS) * _RETICLE_CELL;
  g.drawImage(_reticleImg, sx, sy, _RETICLE_CELL, _RETICLE_CELL,
              0, 0, _RETICLE_CELL, _RETICLE_CELL);
  g.globalCompositeOperation = 'source-in';   // recolour the ink, keep its alpha
  g.fillStyle = color;
  g.fillRect(0, 0, _RETICLE_CELL, _RETICLE_CELL);
  _reticleTinted.set(key, c);
  return c;
}

function cmdReticle(msg) {
  _reticle = (msg && msg.id) ? { id: String(msg.id), color: msg.color || '#ccf',
                                 size: msg.size || 60, cell: msg.cell || 0 } : null;
  _requestRadarRender();
}

// Drawn over the dots, in the same projection, so it tracks a moving contact.
function _drawReticle(ctx, box, cx, cz, halfSpan) {
  if (!_reticle) return;
  let wx, wz;
  const di = _dynamicMap.get(_reticle.id);
  if (di !== undefined && _dynamicPosBuf && di < _dynamicCount) {
    wx = _dynamicPosBuf[di * 3]; wz = _dynamicPosBuf[di * 3 + 1];
  } else {
    const ti = _terrainMap.get(_reticle.id);
    if (ti === undefined || !_terrainPosBuf || ti >= _terrainCount) return;
    wx = _terrainPosBuf[ti * 3]; wz = _terrainPosBuf[ti * 3 + 1];
  }
  const spr = _reticleSprite(_reticle.cell, _reticle.color);
  if (!spr) return;
  const { toX, toY } = _radarProj(box, cx, cz, halfSpan);
  const s = _reticle.size;
  ctx.drawImage(spr, toX(wx) - s / 2, toY(wz) - s / 2, s, s);
}

function _radarProj(box, cx, cz, halfSpan) {
  const scale = box.fit / (2 * halfSpan);
  const cxp = box.bx0 + box.bw / 2;
  const cyp = box.by0 + box.bh / 2;
  return {
    scale, cxp, cyp,
    toX: wx => cxp + (wx - cx) * scale,
    toY: wz => cyp - (wz - cz) * scale,   // +Z up
  };
}

function _drawRadarChrome(ctx, W, H, rect, cx, cz, halfSpan, isCorner, ax, az) {
  const { x0, y0, x1, y1 } = _rectPx(W, H, rect);
  const rw = x1 - x0, rh = y1 - y0;
  if (rw < 4 || rh < 4) return;
  const box = _radarBox(W, H, rect, isCorner);
  if (!box) return;
  const { toX, toY, scale } = _radarProj(box, cx, cz, halfSpan);

  ctx.fillStyle = 'rgba(0,12,30,0.25)';   // near-transparent so the 3D view shows through
  ctx.fillRect(x0, y0, rw, rh);

  if (isCorner) {
    const labelH = Math.max(18, rh * 0.08);
    ctx.fillStyle = 'rgba(0,51,102,0.45)';
    ctx.fillRect(x0, y0, rw, labelH);
    ctx.fillStyle = '#00e5ff';
    ctx.font = `bold ${Math.max(10, labelH * 0.55)}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RADAR', x0 + rw / 2, y0 + labelH / 2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // Clip rings + crosshair to the drawable box so they match the dot scissor.
  ctx.save();
  ctx.beginPath(); ctx.rect(box.bx0, box.by0, box.bw, box.bh); ctx.clip();

  ctx.setLineDash([4, 6]);
  const rings = [0.25, 0.5, 1.0];
  const ringColors = ['rgba(0,180,80,0.15)', 'rgba(0,180,80,0.2)', 'rgba(0,180,80,0.25)'];
  // Centre the range rings on the tracked anchor (ship/centroid) so they pan with
  // the world; fall back to the view centre if no anchor was supplied.
  const ringX = ax != null ? ax : cx, ringZ = az != null ? az : cz;
  const cx_px = toX(ringX), cy_px = toY(ringZ);
  for (let i = 0; i < rings.length; i++) {
    const rpx = rings[i] * halfSpan * scale;
    ctx.strokeStyle = ringColors[i];
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx_px, cy_px, rpx, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.setLineDash([]);

  const ox = toX(0), oy = toY(0);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ox, box.by0); ctx.lineTo(ox, box.by0 + box.bh);
  ctx.moveTo(box.bx0, oy); ctx.lineTo(box.bx0 + box.bw, oy);
  ctx.stroke();
  ctx.restore();
}

function _drawRadarOverlay(ctx, W, H, rect, cx, cz, halfSpan, isCorner) {
  const { x0, y0, x1, y1 } = _rectPx(W, H, rect);
  const rw = x1 - x0, rh = y1 - y0;
  if (rw < 4 || rh < 4) return;
  const box = _radarBox(W, H, rect, isCorner);
  if (!box) return;
  const { toX, toY } = _radarProj(box, cx, cz, halfSpan);
  const fontSize = Math.max(8, Math.min(12, rh * 0.025));
  const minR = isCorner ? 5 : 4, pMinR = isCorner ? 8 : 6;

  // Clip navpoints + arrows to the same box the dots are scissored to.
  ctx.save();
  ctx.beginPath(); ctx.rect(box.bx0, box.by0, box.bw, box.bh); ctx.clip();

  // Navareas: quad regions drawn under the navpoints/ships, with a faint fill,
  // outline, and a centered label in the area's color.
  for (const a of _radarNavareas) {
    const pts = a.points;
    if (!pts || pts.length < 3) continue;
    const col = a.color || '#4fa3ff';
    // The engine's 4 navarea corners arrive in triangle-strip ("Z") order
    // (TL, TR, BL, BR) — walk them 0,1,3,2 so the outline is a proper quad and
    // not a self-crossing bowtie.  Other vertex counts draw in given order.
    const order = pts.length === 4 ? [0, 1, 3, 2] : pts.map((_, i) => i);
    ctx.beginPath();
    ctx.moveTo(toX(pts[order[0]][0]), toY(pts[order[0]][1]));
    for (let i = 1; i < order.length; i++) ctx.lineTo(toX(pts[order[i]][0]), toY(pts[order[i]][1]));
    ctx.closePath();
    ctx.save();
    ctx.globalAlpha = 0.12; ctx.fillStyle = col; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    if (a.name) {
      let mx = 0, my = 0;
      for (const p of pts) { mx += toX(p[0]); my += toY(p[1]); }
