name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Temporarily disabled: many mock tests depend on shipData/data files that are
    # not in this repo (they live in the Cosmos install), plus a couple use Windows
    # path separators - so they can't pass on the bare Linux release runner. The
    # release job only needs to build + archive. Re-enable once these tests are
    # guarded with skipUnless(data present) or moved to a separate push/PR CI.
    # - name: Run tests
    #   run: python -m unittest discover -s tests

    # __lib__.json authors the version, but it does not travel inside the .sbslib -
    # the zip below holds the `sbs_utils` package directory alone. This job zips that
    # folder directly rather than going through `sbs lib`, so without this step the
    # release publishes whatever version__.py happens to be committed. That is how
    # v1.4.0 shipped reporting (1,3,0) to the version_get() MAST global. Stamp from
    # the tag, which is what is actually being released. A non-version tag is skipped,
    # not failed - this workflow fires on every tag.
    - name: Stamp version from the tag
      run: python .github/stamp_version.py "${{ github.ref_name }}"

    - name: Archive sbs_utils
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: '${{ github.event.repository.owner.name }}.${{ github.event.repository.name }}.${{ github.ref_name }}.sbslib'
        path: "sbs_utils"

    - name: Archive cosmos_dev
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: '${{ github.event.repository.owner.name }}.cosmos_dev.${{ github.ref_name }}.sbslib'
        path: "cosmos_dev"

    - name: Archive typings
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: '${{ github.event.repository.name }}.${{ github.ref_name }}.types.zip'
        path: "typings"

    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "${{ github.event.repository.owner.name }}.${{ github.event.repository.name }}.${{ github.ref_name }}.sbslib,${{ github.event.repository.owner.name }}.cosmos_dev.${{ github.ref_name }}.sbslib,${{ github.event.repository.name }}.${{ github.ref_name }}.types.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        # A rolling tag (v1.4.0 is re-pointed as work lands) means the Release usually
        # already exists. Without allowUpdates the action only ever tries to CREATE and
        # dies with 422 already_exists, so every re-release after the first one failed
        # and the published .sbslib silently stayed at the previous build.
        allowUpdates: true
        replacesArtifacts: true
