<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The ePADD icon sheet: 4 x 5 cells of 128px = 512 x 640.
     White on transparent, matching data/graphics/grid-icon-sheet.png, so a
     style string's `color:` does all the tinting - one glyph, every state.
     Drawn flat and geometric to sit with Goldman's squared letterforms,
     rather than the solid game-icons.net style of the built-in sheet. */
  html, body { margin: 0; padding: 0; background: transparent; }
  #sheet { display: grid; grid-template-columns: repeat(4, 128px);
           grid-auto-rows: 128px; width: 512px; }
  #sheet svg { width: 128px; height: 128px; display: block; }
  /* 96px of art centred in a 128px cell: viewBox 24 units -> 16 units of art
     inset by 4, so every glyph shares one optical size. */
</style>
</head>
<body>
<div id="sheet">

  <!-- 0 cargo -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M16 4l12 6-12 6-12-6z"></path>
    <path d="M4 10v12l12 6 12-6V10"></path>
    <path d="M16 16v12"></path>
  </svg>

  <!-- 1 fabricate -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3 5h26"></path>
    <path d="M13 5v4h6V5"></path>
    <path d="M16 9v3"></path>
    <path d="M3 27h26"></path>
    <path d="M9 27v-5h6v-4h8v9"></path>
  </svg>

  <!-- 2 upgrades: a chevron rising inside a module hex -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M16 4l10 6v12l-10 6-10-6V10z"></path>
    <path d="M10.5 19L16 13.5 21.5 19"></path>
    <path d="M10.5 24L16 18.5 21.5 24"></path>
  </svg>

  <!-- 3 quests: a pennant on a mast, with a marked base -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M9 28V4"></path>
    <path d="M9 5h16l-4 5 4 5H9"></path>
    <path d="M5 28h8"></path>
  </svg>

  <!-- 4 library: an open book on a stand -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M16 9v17"></path>
    <path d="M16 9c-2.5-2-6-2.6-11-2.6V23c5 0 8.5.6 11 2.6"></path>
    <path d="M16 9c2.5-2 6-2.6 11-2.6V23c-5 0-8.5.6-11 2.6"></path>
  </svg>

  <!-- 5 help: a question set in a ring -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <circle cx="16" cy="16" r="11.5"></circle>
    <path d="M12.4 12.6a3.7 3.7 0 0 1 7.3.9c0 2.6-3.7 3-3.7 5.4" stroke-linecap="round"></path>
    <path d="M16 22.6v1.6"></path>
  </svg>

  <!-- 6 airwing: a delta fighter, plan view -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M16 3l4 12 7 7v3l-7-2-4 6-4-6-7 2v-3l7-7z"></path>
    <path d="M16 9v13"></path>
  </svg>

  <!-- 7 casino: a chip over a card -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <circle cx="16" cy="16" r="12"></circle>
    <circle cx="16" cy="16" r="6"></circle>
    <path d="M16 4v5M16 23v5M4 16h5M23 16h5"></path>
  </svg>

  <!-- 8 damage: a breached hull plate -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M5 5h22v22H5z"></path>
    <path d="M16 5l-4 7 6 3-5 5 4 7"></path>
  </svg>

  <!-- 9 hangar -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3 5h26v18H3z"></path>
    <path d="M3 27h26"></path>
    <path d="M12 5v18M20 5v18"></path>
    <path d="M12 9l-5 5 5 5M20 9l5 5-5 5"></path>
  </svg>

  <!-- 10 comms log: a hail bubble with entries -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 6h24v15H12l-8 7z"></path>
    <path d="M9 12h14M9 16h9"></path>
  </svg>

  <!-- 11 standings -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 27h24"></path>
    <path d="M7 27V19h5v8"></path>
    <path d="M13.5 27V11h5v16"></path>
    <path d="M20 27V15h5v12"></path>
  </svg>

  <!-- 12 debug: a lens over a circuit node -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 4h11v11H4z"></path>
    <path d="M4 20h8v8M20 4v8h8"></path>
    <circle cx="20.5" cy="20.5" r="6.5"></circle>
    <path d="M25 25l4 4" stroke-linecap="round"></path>
  </svg>

  <!-- 13 mast: a task tree -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M11 4h10v6H11z"></path>
    <path d="M16 10v6"></path>
    <path d="M7 16h18"></path>
    <path d="M7 16v5M25 16v5M16 16v5"></path>
    <path d="M3 21h8v6H3zM12 21h8v6h-8zM21 21h8v6h-8z"></path>
  </svg>

  <!-- 14 brain: a scan pulse through the processor -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M9 9h14v14H9z"></path>
    <path d="M13 2v7M19 2v7M13 23v7M19 23v7M2 13h7M2 19h7M23 13h7M23 19h7"></path>
    <path d="M11 17h2.5l1.5-4 2 8 1.5-4H21" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>

  <!-- 15 coverage: a checked manifest -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M6 3h20v26H6z"></path>
    <path d="M10 10l2.5 2.5L17 8" stroke-linecap="round"></path>
    <path d="M10 20l2.5 2.5L17 18" stroke-linecap="round"></path>
    <path d="M20 11h3M20 21h3"></path>
  </svg>

  <!-- 16 messages: an envelope. `comms_log` is already the speech bubble, and these
       are letters from home as much as they are texts between consoles. -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3 7h26v18H3z"></path>
    <path d="M3 7l13 10L29 7"></path>
    <path d="M3 25l9-8M29 25l-9-8"></path>
  </svg>

  <!-- 17 status: a gauge. What the crew read at a glance, so it reads as a reading. -->
  <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 24a12 12 0 0 1 24 0"></path>
    <path d="M4 24h6M22 24h6"></path>
    <path d="M16 24L23 14" stroke-linecap="round"></path>
    <path d="M8.5 15.5l2 2M16 10v3M23.5 15.5l-2 2"></path>
  </svg>

</div>
</body>
</html>
