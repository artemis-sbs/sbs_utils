<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap');
    /* The SAME Cosmos console vocabulary as design/epadd/_style.inc - the xESS is the
       ePADD's small sibling, not a second look. Values lifted from the engine + LM
       sources: gui-1..6 = 22/24/28/32/36/52, panels #1572, headers #1578.
       Goldman is the same family on Google Fonts; Barlow Semi Condensed stands in for
       GoldmanSansCd_Rg, which is not published there.

       WHAT DIFFERS FROM THE PADD, and it is only ever size: this is a 640px column
       beside a map, not a 1920px sheet. So the tile grid is one column rather than
       four, and the chrome is one 56px bar rather than a 64px bar under a 35px strip.

       TWO BANDS, NOT THREE. An earlier version of this file kept a permanent choices
       band pinned to the bottom. It was wrong: three of the device's functions were
       apps behind tiles and two - answering the scene, and leaving the surface - were
       loose chrome stapled under them. Everything is an app now. */
    :root {
      --ground:      #0a1420;
      --panel:       rgba(17, 85, 119, 0.13);   /* #1572 */
      --panel-hi:    rgba(17, 85, 119, 0.33);   /* #1575 */
      --panel-head:  rgba(17, 85, 119, 0.53);   /* #1578 */
      --hair:        rgba(136, 204, 255, 0.16);
      --text:        #ffffff;
      --dim:         #9ab;
      --accent:      #8cf;
      --good:        #8f8;
      --warn:        #ffd76a;
      --alert:       #f55;
      --display: 'Goldman', 'Goldman-Bold', system-ui, sans-serif;
      --body: 'Barlow Semi Condensed', 'GoldmanSansCd_Rg', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 640px; height: 1080px; overflow: hidden;
      background-color: var(--ground);
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 160px),
        repeating-linear-gradient(0deg,  rgba(255,255,255,.018) 0 1px, transparent 1px 160px),
        radial-gradient(120% 60% at 30% 4%, rgba(30,72,110,.30), transparent 62%);
      color: var(--text);
      font-family: var(--body);
      font-size: 24px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }

    /* --- the column ------------------------------------------------------- */
    .dev { position: absolute; inset: 0; display: flex; flex-direction: column; }

    /* THE IDENTITY BAR. One row, 56px. Everything the old panel spent a face and four
       rows saying, on one line - because none of it changes and all of it is reference.
       It is also the one thing on screen in EVERY state, which is why ARMED lands here. */
    .who { flex: 0 0 56px; display: flex; align-items: center; gap: 16px;
           padding: 0 20px; background: var(--panel-head);
           border-bottom: 1px solid var(--hair); }
    .who .name { font-family: var(--display); font-weight: 700; font-size: 24px;
                 letter-spacing: .02em; white-space: nowrap; }
    .who .job  { font-size: 22px; color: var(--accent); letter-spacing: .04em; }
    .who .at   { margin-left: auto; font-size: 22px; color: var(--dim);
                 letter-spacing: .04em; white-space: nowrap; }
    .dev.live .who { background: rgba(255,85,85,.22); border-bottom-color: var(--alert); }
    .dev.live .who .at { color: #fff; font-family: var(--display); }

    /* THE APP AREA. Everything under the bar belongs to whatever is open - the home
       sheet, or one app using the lot. Nothing is pinned below it. */
    .app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
           padding: 22px 20px 24px 20px; gap: 18px; overflow: hidden; }

    .app-head { display: flex; align-items: center; gap: 14px; }
    .app-head h2 { margin: 0; font-family: var(--display); font-weight: 700;
                   font-size: 24px; letter-spacing: .18em; color: var(--accent);
                   text-transform: uppercase; }
    .app-head .rule { flex: 1 1 auto; height: 1px; background: var(--hair); }
    .app-head .back { font-family: var(--display); font-size: 22px; letter-spacing: .10em;
                      color: var(--dim); background: none; border: 1px solid var(--hair);
                      padding: 6px 14px; cursor: pointer; }
    .app-head .back:hover { color: var(--text); border-color: var(--accent); }

    /* --- the home sheet ---------------------------------------------------- */
    /* The scene's own line, on HOME as well as inside ACT: the device always has
       something to say when you glance at it. Prose, so it gets a scroll of its own. */
    .say { flex: 0 1 auto; min-height: 0; overflow: auto; font-size: 24px;
           line-height: 1.35; color: var(--text); }
    .say .quiet { color: var(--dim); }
    .say p { margin: 0 0 12px 0; }
    .say p:last-child { margin-bottom: 0; }

    /* ONE COLUMN of tiles, not four. A 640px column divided four ways is 160px a tile,
       which is narrower than the words on it. */
    .tiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .tile { width: 100%; display: flex; align-items: center; gap: 18px;
            padding: 18px 20px; background: var(--panel);
            border: 1px solid var(--hair); cursor: pointer; text-align: left;
            color: inherit; font: inherit;
            transition: background .12s, border-color .12s; }
    .tile:hover { background: var(--panel-hi); border-color: rgba(136,204,255,.42); }
    .tile .ico { flex: 0 0 auto; width: 40px; height: 40px; display: block; }
    .tile .lbl { min-width: 0; flex: 1 1 auto; }
    .tile h3 { margin: 0 0 2px 0; font-family: var(--display); font-weight: 700;
               font-size: 28px; line-height: 1.05; color: var(--text); }
    .tile p  { margin: 0; font-size: 22px; line-height: 1.2; color: var(--dim); }
    /* The badge is TEXT, like the PADD's - not a dot and not a count widget, because
       "3 here" says what a dot cannot. It is how a beat announces itself without
       taking the screen. */
    .tile .badge { flex: 0 0 auto; font-size: 22px; color: var(--accent);
                   letter-spacing: .04em; white-space: nowrap; }
    .tile .badge.hot { color: var(--alert); }

    /* --- ACT: the beat, then one button per choice -------------------------- */
    .beat { font-size: 24px; line-height: 1.35; max-height: 280px; overflow: auto; }
    .beat p { margin: 0 0 12px 0; }
    .beat p:last-child { margin-bottom: 0; }
    .picks { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
    /* A BUTTON, pressed once. The old panel made you select a row of text and then
       press ACT - a settings-screen interaction on a thing held in one hand. */
    .pick { width: 100%; text-align: left; padding: 16px 18px; font: inherit;
            font-size: 24px; line-height: 1.25; color: var(--text);
            background: var(--panel-hi); border: 1px solid var(--hair);
            cursor: pointer; transition: border-color .12s, background .12s; }
    .pick:hover { border-color: var(--accent); background: rgba(17,85,119,.45); }
    .pick .for { display: block; margin-top: 4px; font-size: 22px; color: var(--dim); }

    /* --- CREW: who you can reach, what they last said, and the way home ------ */
    /* HAIL AND PARTY WERE THE SAME APP. One held three abstract audience tokens
       (SHIP / PARTY / ALL) and the other held the actual people; merging them turns
       an audience picker into a list of who is out here. The roster IS the inbox,
       grouped by who said it - messages already carry `from`, so this costs nothing
       to render and answers "did the ship call?" and "where is Marek?" at once.

       THE SHIP IS A ROW, and it is the row that carries BEAM UP - the ship is what
       beams you up, so leaving lives with the thing that does it rather than under
       every screen. */
    .callers { display: flex; flex-direction: column; gap: 14px; overflow: auto;
               flex: 1 1 auto; min-height: 0; }
    .caller { padding: 14px 16px; background: var(--panel);
              border: 1px solid var(--hair); border-left: 3px solid var(--hair); }
    .caller.ship { border-left-color: var(--accent); }
    .caller.you  { border-left-color: var(--good); }
    .caller .top { display: flex; align-items: baseline; gap: 12px; }
    .caller .n   { font-family: var(--display); font-size: 24px; }
    .caller .j   { font-size: 22px; color: var(--accent); letter-spacing: .04em; }
    .caller .cnt { margin-left: auto; font-size: 22px; color: var(--accent);
                   white-space: nowrap; }
    .caller .cnt.me { color: var(--dim); }
    .caller .r    { margin-top: 3px; font-size: 22px; color: var(--dim); }
    .caller .said { margin: 8px 0 0 0; font-size: 24px; line-height: 1.3; }
    .caller .said .ago { color: var(--dim); font-size: 22px; }
    .caller .said.quiet { color: var(--dim); }
    .acts2 { display: flex; gap: 10px; margin-top: 10px; }
    .acts2 button { flex: 1 1 auto; padding: 10px 0; font-family: var(--display);
                    font-size: 22px; letter-spacing: .06em; color: var(--text);
                    background: var(--panel-hi); border: 1px solid var(--hair);
                    cursor: pointer; }
    .acts2 button:hover { border-color: var(--accent); }
    .acts2 button.home { color: var(--warn); }
    .site { font-family: var(--display); font-size: 24px; letter-spacing: .04em; }
    .count, .more { font-size: 22px; color: var(--dim); letter-spacing: .04em; }

    /* --- readouts (SCAN, HAIL, FIRE) ---------------------------------------- */
    .read { display: flex; flex-direction: column; gap: 10px; }
    .read .line { display: flex; align-items: baseline; gap: 14px; font-size: 24px; }
    .read .line .k { color: var(--dim); letter-spacing: .04em; }
    .read .line .v { margin-left: auto; font-family: var(--display); }
    .v.ok    { color: var(--good); }
    .v.worn  { color: var(--warn); }
    .v.hurt  { color: var(--alert); }

    /* --- the weapon --------------------------------------------------------- */
    .arm { display: flex; flex-direction: column; gap: 14px; }
    .arm .state { padding: 14px 18px; font-family: var(--display); font-size: 28px;
                  letter-spacing: .10em; text-align: center;
                  border: 1px solid var(--hair); color: var(--dim); }
    .arm .state.live { color: #fff; background: rgba(255,85,85,.18);
                       border-color: var(--alert); }
    /* THREE SETTINGS, and they are a ladder: stop a person, open a thing, destroy it.
       The point of the third is that lethality is CHOSEN and named, rather than falling
       out of pointing a cutting tool at somebody - which is the same argument that
       keeps the setting ahead of the target. */
    .setting { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .setting button { padding: 12px 0; background: var(--panel);
                      border: 1px solid var(--hair); color: var(--dim);
                      font-family: var(--display); font-size: 24px; letter-spacing: .06em;
                      cursor: pointer; }
    .setting button.on { color: var(--text); border-color: var(--accent);
                         background: var(--panel-hi); }
    /* FULL is the one that reads differently even before it is armed. */
    .setting button.full.on { border-color: var(--alert); color: #fff;
                              background: rgba(255,85,85,.20); }
    .effect { font-size: 22px; color: var(--dim); line-height: 1.35; margin: 0; }
    .effect b { color: var(--text); font-weight: 500; }
    .warnline { font-size: 22px; color: var(--alert); letter-spacing: .04em; margin: 0; }
    .spacer { flex: 1 1 auto; min-height: 0; }

  </style>
</helmet>
<!-- ACT, as it arrives: a new beat OPENS this app by itself on every console at the
     site. Nobody has to notice a badge to be in the scene. The one exception is a
     console holding an armed weapon, which is never yanked off its own screen. -->
<div class="dev">

  <div class="who">
    <span class="name">Ume Mbeki</span>
    <span class="job">comms</span>
    <span class="at">Sample Lab</span>
  </div>

  <div class="app">
    <div class="app-head">
      <h2>Act</h2>
      <div class="rule"></div>
      <button class="back">BACK</button>
    </div>

    <div class="beat">
      <p>Containment on bench three has failed. The gel is cold and the seal was
      opened from the inside.</p>
      <p>Chief Ruiz is two rooms away and cannot see any of this.</p>
    </div>

    <div class="picks">
      <button class="pick">Examine the containment gel</button>
      <button class="pick">Read the sample manifest</button>
      <button class="pick">
        Force the manifest lock
        <span class="for">(covering for Chief Ruiz)</span>
      </button>
      <button class="pick">Go down to the reactor gallery</button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
